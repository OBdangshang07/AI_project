<!doctype html><html><body style="margin:0;background:#000">
<canvas id=c width=640 height=360></canvas>
<pre id=o style="color:#0f0;font:14px monospace"></pre>
<script>
const c=document.getElementById('c');const gl=c.getContext('webgl2')||c.getContext('webgl');
let t='NO WEBGL';
if(gl){const d=gl.getExtension('WEBGL_debug_renderer_info');
 t='WEBGL OK v='+gl.getParameter(gl.VERSION)+'\nRENDERER='+(d?gl.getParameter(d.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER))+'\nMAXTEX='+gl.getParameter(gl.MAX_TEXTURE_SIZE);
 gl.clearColor(0.1,0.45,0.75,1);gl.clear(gl.COLOR_BUFFER_BIT);}
document.getElementById('o').textContent=t;document.title=t.split('\n')[0];
</script></body></html>
