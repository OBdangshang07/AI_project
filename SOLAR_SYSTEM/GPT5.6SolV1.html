    const asteroidGroup=new THREE.Group();scene.add(asteroidGroup);const asteroidCount=440;
    function irregularGeometry(seed){const g=new THREE.IcosahedronGeometry(.055,1),a=g.attributes.position;for(let i=0;i<a.count;i++){const x=Math.sin(i*12.9898+seed*7.31)*43758.5453%1;const f=.62+Math.abs(x)*.56;a.setXYZ(i,a.getX(i)*f,a.getY(i)*f,a.getZ(i)*f);}g.computeVertexNormals();return g;}
    let made=0;for(let batch=0;batch<4;batch++){const count=asteroidCount/4,mesh=new THREE.InstancedMesh(irregularGeometry(batch+2),new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(.08,.08,.25+batch*.025),roughness:1,metalness:0}),count),dummy=new THREE.Object3D();for(let i=0;i<count;i++){const a=(2.12+Math.random()*1.22)*AU,e=.02+Math.random()*.22,theta=Math.random()*TAU,b=a*Math.sqrt(1-e*e),inc=(Math.random()-.5)*.28;dummy.position.set(a*(Math.cos(theta)-e),Math.sin(theta)*b*Math.sin(inc),Math.sin(theta)*b*Math.cos(inc));dummy.rotation.set(Math.random()*TAU,Math.random()*TAU,Math.random()*TAU);const s=.45+Math.random()*1.9;dummy.scale.set(s*(.7+Math.random()*.5),s*(.65+Math.random()*.55),s*(.65+Math.random()*.5));dummy.updateMatrix();mesh.setMatrixAt(i,dummy.matrix);made++;}mesh.instanceMatrix.needsUpdate=true;asteroidGroup.add(mesh);}
    // Vesta and Pallas as named irregular objects
    function namedAsteroid(id,cn,en,a,e,inc,shader,display){const d={id,cn,en,type:'小行星',shader,r:display/RADII,display,diameter:id==='vesta'?525:513,a,e,inc,rot:id==='vesta'?.222:.325,period:id==='vesta'?3.63:4.62,temp:'约 −188°C — −3°C',moons:0,color:id==='vesta'?0xaaa8a0:0x696764,desc:'小行星带中的大型原行星残骸，表面保留着早期太阳系的碰撞历史。'};allData.push(d);createBody(d);d.mesh.geometry=irregularGeometry(Math.random()*9);d.mesh.scale.setScalar(display/.055);d.mesh.material=bodyMaterial(shader,d.color);return d;}namedAsteroid('vesta','灶神星','Vesta',2.362,.089,7.14,40,.09);namedAsteroid('pallas','智神星','Pallas',2.773,.231,34.84,40,.085);

    // Kuiper belt crystalline haze
    let kuiper;{const n=6500,p=new Float32Array(n*3),alpha=new Float32Array(n);for(let i=0;i<n;i++){const a=(34+Math.random()*26)*AU,e=Math.random()*.24,t=Math.random()*TAU,b=a*Math.sqrt(1-e*e),inc=(Math.random()-.5)*.42;p.set([a*(Math.cos(t)-e),Math.sin(t)*b*Math.sin(inc),Math.sin(t)*b*Math.cos(inc)],i*3);alpha[i]=Math.random();}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('seed',new THREE.BufferAttribute(alpha,1));const m=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,vertexShader:`attribute float seed;varying float s;void main(){s=seed;vec4 mv=modelViewMatrix*vec4(position,1.);gl_Position=projectionMatrix*mv;gl_PointSize=(.5+seed*1.25)*(500./-mv.z);}`,fragmentShader:`varying float s;void main(){float d=length(gl_PointCoord-.5);if(d>.5)discard;gl_FragColor=vec4(.44+.4*s,.68+.25*s,1.,(1.-d*2.)*.42);}`});kuiper=new THREE.Points(g,m);scene.add(kuiper);}
    // Symbolic Oort cloud
    {const n=2600,p=new Float32Array(n*3);for(let i=0;i<n;i++){const v=new THREE.Vector3().randomDirection().multiplyScalar(950+Math.random()*600);p.set([v.x,v.y,v.z],i*3);}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));const m=new THREE.PointsMaterial({size:.33,color:0x7390aa,transparent:true,opacity:.24,depthWrite:false});scene.add(new THREE.Points(g,m));}

    // Sporadic meteors with shader-faded golden tails
    const meteors=[];const meteorMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,vertexColors:true,uniforms:{life:{value:0}},vertexShader:`attribute float fade;varying float v;void main(){v=fade;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,fragmentShader:`uniform float life;varying float v;void main(){gl_FragColor=vec4(mix(vec3(1.,.38,.05),vec3(1.),v),v*(1.-life));}`});
    function spawnMeteor(){const start=new THREE.Vector3((Math.random()-.5)*240,50+Math.random()*90,(Math.random()-.5)*180);const dir=new THREE.Vector3(-.7-Math.random(),-.2-Math.random()*.35,.2*(Math.random()-.5)).normalize();const positions=[],fade=[];for(let i=0;i<18;i++){const t=i/17;positions.push(...start.clone().addScaledVector(dir,t*22).toArray());fade.push(t);}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));g.setAttribute('fade',new THREE.Float32BufferAttribute(fade,1));const line=new THREE.Line(g,meteorMat.clone());scene.add(line);meteors.push({line,life:0,duration:.55+Math.random()*.35,vel:dir.multiplyScalar(52)});}

    const sim={days:0,speed:20,direction:1,date:new Date('2046-01-01T00:00:00Z')};
    function updateBodies(){for(const d of bodyDefs.concat(allData.filter(x=>x.id==='vesta'||x.id==='pallas'))){if(d.a){const phase=(hashString(d.id)%1000)/1000*TAU,periodDays=d.period*365.25,ang=phase+sim.direction*sim.days/periodDays*TAU;d.node.position.copy(ellipsePosition(d,ang));}if(typeof d.rot==='number')d.mesh.rotation.y=sim.direction*sim.days/d.rot*TAU;d.mesh.material.uniforms.uTime.value=sim.days*.12;}
      for(const d of moonDefs){const phase=(hashString(d.id)%1000)/1000*TAU,ang=phase+sim.direction*sim.days/d.periodDays*TAU;d.node.position.set(Math.cos(ang)*d.aMoon,Math.sin(ang*.37)*d.aMoon*.06,Math.sin(ang)*d.aMoon);d.mesh.rotation.y=sim.direction*sim.days/d.rot*TAU;d.mesh.material.uniforms.uTime.value=sim.days*.12;}
      ringMat.uniforms.time.value=sim.days*.02;asteroidGroup.rotation.y=sim.direction*sim.days/1680*TAU;
    }
    function hashString(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h);}
    updateBodies();

    const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();let selected=null,flight=null,dragStart={x:0,y:0},lastMeteor=0;
    function pointerNDC(e){const r=renderer.domElement.getBoundingClientRect();pointer.x=(e.clientX-r.left)/r.width*2-1;pointer.y=-(e.clientY-r.top)/r.height*2+1;}
    function pick(e){pointerNDC(e);raycaster.setFromCamera(pointer,camera);const hit=raycaster.intersectObjects(selectable,false)[0];return hit?.object.userData.body||null;}
    renderer.domElement.addEventListener('pointerdown',e=>dragStart={x:e.clientX,y:e.clientY});
    renderer.domElement.addEventListener('click',e=>{if(Math.hypot(e.clientX-dragStart.x,e.clientY-dragStart.y)>5)return;selectBody(pick(e));});
    renderer.domElement.addEventListener('dblclick',e=>{const d=pick(e);if(d){selectBody(d);focusBody(d);}});
    function selectBody(d){selected=d;document.querySelectorAll('.celestial-label').forEach(x=>x.classList.remove('selected'));orbitLines.forEach(x=>{x.material.opacity=x.userData.baseOpacity;x.material.color.set(objects.get(x.userData.owner)?.color||0x52677c);});if(!d){showInfo(null);return;}d.node.userData.label?.element.classList.add('selected');if(d.orbitLine){d.orbitLine.material.opacity=.92;d.orbitLine.material.color.set(0xbcefff);}showInfo(d);}
    function showInfo(d){const base=d||{cn:'太阳系',en:'Solar System',type:'行星系统',desc:'一座以实时轨道动力学驱动的程序化太阳系。双击任意天体进入近地观察。'};document.querySelector('#info-name').textContent=base.cn;document.querySelector('#info-en').textContent=base.en.toUpperCase();document.querySelector('#info-desc').textContent=base.desc||`${base.cn}是一颗以程序化分形纹理重建的${base.type}，其轨道由真实半长轴、偏心率与周期驱动。`;setMetric('m-type',base.type);setMetric('m-diameter',base.diameter?base.diameter.toLocaleString()+' km':'—');setMetric('m-axis',base.a!==undefined?(base.a?base.a.toFixed(base.a<10?3:2)+' AU':'0 AU'):'—');setMetric('m-rotation',typeof base.rot==='number'?`${Math.abs(base.rot).toLocaleString()} 地球日${base.rot<0?' · 逆行':''}`:base.rot||'—');setMetric('m-orbit',base.periodDays?base.periodDays+' 地球日':base.period?base.period+' 地球年':'—');setMetric('m-temp',base.temp||'—');setMetric('m-moons',base.moons!==undefined?String(base.moons):'—');}
    function setMetric(id,value){const el=document.getElementById(id);el.animate([{opacity:.1,transform:'translateY(5px)'},{opacity:1,transform:'none'}],{duration:330,easing:'ease-out'});el.textContent=value;}
    function focusBody(d){const wp=new THREE.Vector3();d.node.getWorldPosition(wp);const r=(d.display||d.r*RADII)*(d.scale?Math.max(...d.scale):1),dist=Math.max(r*7,.22);const dir=camera.position.clone().sub(controls.target).normalize();flyTo(wp.clone().add(dir.multiplyScalar(dist)).add(new THREE.Vector3(0,r*1.8,0)),wp,1500);}
    function flyTo(pos,target,duration=1800){flight={fromP:camera.position.clone(),fromT:controls.target.clone(),toP:pos.clone(),toT:target.clone(),start:performance.now(),duration};}
    function updateFlight(now){if(!flight)return;let t=Math.min(1,(now-flight.start)/flight.duration);t=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;camera.position.lerpVectors(flight.fromP,flight.toP,t);controls.target.lerpVectors(flight.fromT,flight.toT,t);if(t>=1)flight=null;}
    const views={overview:{p:[150,260,510],t:[0,0,0]},inner:{p:[34,42,78],t:[0,0,0]},jupiter:{id:'jupiter',offset:[4.7,2.8,5.6]},saturn:{id:'saturn',offset:[5.1,3.7,6.2]},pluto:{id:'pluto',offset:[1.2,.75,1.45]}};
    function goView(name){const v=views[name];if(v.id){const d=objects.get(v.id),p=new THREE.Vector3();d.node.getWorldPosition(p);selectBody(d);flyTo(p.clone().add(new THREE.Vector3(...v.offset)),p,1900);}else flyTo(new THREE.Vector3(...v.p),new THREE.Vector3(...v.t),1900);}
    document.querySelectorAll('#presets button').forEach(b=>b.onclick=()=>goView(b.dataset.view));document.querySelector('#reset').onclick=()=>{selectBody(null);flyTo(new THREE.Vector3(38,46,74),new THREE.Vector3(),1700);};

    // Search in Chinese, English, and alternate transliterations
    const search=document.querySelector('#search'),results=document.querySelector('#search-results');
    search.addEventListener('input',()=>{const q=search.value.trim().toLowerCase();if(!q){results.style.display='none';return;}const list=allData.filter(d=>(d.cn+d.en+(d.aliases||'')).toLowerCase().includes(q)).slice(0,9);results.innerHTML=list.map(d=>`<div class="result" data-id="${d.id}">${d.cn} · ${d.en}<span>${d.type}</span></div>`).join('')||'<div class="result">未找到匹配天体</div>';results.style.display='block';});
    results.addEventListener('click',e=>{const id=e.target.closest('[data-id]')?.dataset.id;if(!id)return;const d=objects.get(id);selectBody(d);focusBody(d);search.value=`${d.cn} · ${d.en}`;results.style.display='none';});
    document.addEventListener('pointerdown',e=>{if(!e.target.closest('.searchbox'))results.style.display='none';});
    function bindToggle(id,fn){document.getElementById(id).addEventListener('change',e=>fn(e.target.checked));}
    bindToggle('t-asteroid',v=>{asteroidGroup.visible=v;objects.get('ceres').node.visible=v;objects.get('vesta').node.visible=v;objects.get('pallas').node.visible=v;});bindToggle('t-kuiper',v=>kuiper.visible=v);bindToggle('t-orbits',v=>orbitLines.forEach(x=>x.visible=v));bindToggle('t-labels',v=>labelRenderer.domElement.style.display=v?'block':'none');bindToggle('t-atmo',v=>atmospheres.forEach(x=>x.visible=v));
    document.querySelector('#time-scale').oninput=e=>{sim.speed=+e.target.value;document.querySelector('#time-out').textContent=sim.speed+'×';};document.querySelector('#direction').onclick=e=>{sim.direction*=-1;e.target.textContent='公转方向 · '+(sim.direction>0?'顺行':'逆行');};
    document.querySelector('#brightness').oninput=e=>{const v=+e.target.value;bloom.strength=v;renderer.toneMappingExposure=.72+v*.27;ambient.intensity=.08+v*.08;document.querySelector('#bright-out').textContent=v.toFixed(2);};
    document.querySelector('#star-density').oninput=e=>{const v=+e.target.value;starField.geometry.setDrawRange(0,Math.floor(STAR_COUNT*v/100));document.querySelector('#stars-out').textContent=v+'%';};

    let last=performance.now(),fpsLast=last,frames=0;
    function updateLabels(){const show=document.querySelector('#t-labels').checked;for(const d of allData){if(!d.node?.userData.label)continue;const p=new THREE.Vector3();d.node.getWorldPosition(p);const dist=camera.position.distanceTo(p),r=d.display||d.r*RADII;const apparent=r/dist;const isSel=d===selected;let opacity=isSel?1:THREE.MathUtils.smoothstep(apparent,.00010,.004);if(d.type==='卫星'&&!isSel)opacity*=THREE.MathUtils.smoothstep(apparent,.0008,.006);const el=d.node.userData.label.element;el.style.opacity=show?String(opacity):'0';el.style.display=opacity<.035?'none':'block';const s=isSel?1:THREE.MathUtils.clamp(.55+apparent*90,.55,1);el.style.fontSize=`${10*s}px`;}}
    function animate(now){requestAnimationFrame(animate);const dt=Math.min(.05,(now-last)/1000);last=now;sim.days+=dt*sim.speed;sim.date=new Date(Date.parse('2046-01-01T00:00:00Z')+sim.days*86400000);updateBodies();updateFlight(now);controls.update();starField.material.uniforms.time.value=now*.001;scene.traverse(o=>{if(o.userData.solarWind)o.material.uniforms.time.value=now*.001;});
      if(now-lastMeteor>3500+Math.random()*6500){spawnMeteor();lastMeteor=now;}for(let i=meteors.length-1;i>=0;i--){const m=meteors[i];m.life+=dt;m.line.position.addScaledVector(m.vel,dt);m.line.material.uniforms.life.value=m.life/m.duration;if(m.life>m.duration){scene.remove(m.line);m.line.geometry.dispose();m.line.material.dispose();meteors.splice(i,1);}}
      updateLabels();composer.render();labelRenderer.render(scene,camera);frames++;if(now-fpsLast>500){document.querySelector('#fps').textContent='FPS '+Math.round(frames*1000/(now-fpsLast));fpsLast=now;frames=0;}document.querySelector('#date').textContent=sim.date.toLocaleString('zh-CN',{timeZone:'UTC',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).replaceAll('/',' · ')+' UTC';}
    document.querySelector('#count').textContent=`CELESTIAL OBJECTS ${String(allData.length+asteroidCount).padStart(3,'0')}`;
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);});
    showInfo(null);requestAnimationFrame(animate);
  </script>
</body>
</html>
