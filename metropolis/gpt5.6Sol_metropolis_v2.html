 for(let i=0;i<count;i++){let vertical=R()<.5,road=roadCenters[Math.floor(R()*roadCenters.length)],dir=R()<.5?1:-1,lane=(dir>0?-.23:.23)*params.roadWidth,t=(R()*2-1)*extent,isTruck=R()<params.truckRatio,scale=params.vehicleScale*(isTruck?1.25:.78+R()*.25),color=new THREE.Color().setHSL(R(),params.vehicleSaturation*.72,.32+R()*.25),showcase=i<26;if(showcase){vertical=true;road=0;t=-citySize*.23+(i-13)*22;dir=i%2?1:-1;lane=(dir>0?-.23:.23)*params.bridgeWidth}vehicleMeshes.body.setColorAt(i,color);vehicles.push({vertical,road,dir,lane,t,speedFactor:1+(R()-.5)*params.speedVariance,scale,len:isTruck?1.55:1,bridge:showcase||(vertical&&Math.abs(road)<1&&R()<params.bridgeTraffic)})}

}
function updateTraffic(dt){const extent=citySize*.53,m=new THREE.Matrix4(),pos=new THREE.Vector3(),quat=new THREE.Quaternion(),scale=new THREE.Vector3();for(let i=0;i<vehicles.length;i++){const v=vehicles[i];v.t+=v.dir*params.trafficSpeed*v.speedFactor*params.trafficFlow*dt;if(v.t>extent)v.t=-extent;if(v.t<-extent)v.t=extent;let yaw;if(v.vertical){pos.set(v.road+v.lane,.47,v.t);yaw=v.dir>0?0:Math.PI;if(v.bridge)pos.y=bridgeFn(v.t)+.82}else{pos.set(v.t,.47,v.road+v.lane);yaw=v.dir>0?Math.PI*.5:-Math.PI*.5}quat.setFromAxisAngle(new THREE.Vector3(0,1,0),yaw);scale.set(v.scale,v.scale,v.scale*v.len);m.compose(pos,quat,scale);for(const mesh of Object.values(vehicleMeshes))mesh.setMatrixAt(i,m)}for(const mesh of Object.values(vehicleMeshes))mesh.instanceMatrix.needsUpdate=true}
