 ]},
 {id:'post',name:'镜头与后期',items:[
  ['exposure','曝光',.15,3,.01,1.05],['toneMap','色调映射',0,2,1,0,{type:'select',options:['ACES 电影','Reinhard','Uncharted']}],['contrast','对比度',.5,2,.01,1.08],['saturation','饱和度',0,2,.01,1.03],['gamma','伽马',.5,2,.01,1],['temperature','色温',-1,1,.01,.08],['tint','色调偏移',-1,1,.01,0],['bloom','辉光',0,3,.01,.72],['bloomThreshold','辉光阈值',0,4,.01,1.05],['bloomRadius','辉光半径',0,3,.01,1.15],['glare','镜头眩光',0,2,.01,.42],['anamorphic','横向耀斑',0,2,.01,.28],['vignette','暗角',0,1,.01,.32],['grain','胶片颗粒',0,.3,.001,.035],['chromatic','色差',0,2,.01,.18],['sharpen','锐化',0,2,.01,.38],['dof','景深',0,2,.01,.08],['focusDistance','焦点距离',5,700,1,170],['aperture','光圈',0,3,.01,.5],['motionBlur','运动模糊',0,1,.01,0],['lensDirt','镜头尘斑',0,1,.01,.08],['tealOrange','青橙分级',0,1,.01,.12],['fade','褪色',0,1,.01,.02],['barrel','镜头畸变',-.4,.4,.001,.02],['pixelate','像素化',0,8,1,0],['scanlines','扫描线',0,1,.01,0]

 {id:'camera',name:'相机与性能',items:[
  ['fov','视野角度',30,105,1,68,{shader:false}],['cameraSpeed','飞行速度',5,240,1,42,{shader:false}],['sprintMultiplier','加速倍率',1,8,.1,3,{shader:false}],['mouseSensitivity','环顾灵敏度',.05,1,.01,.22,{shader:false}],['autoFly','自动巡航',0,1,1,1,{type:'check',shader:false}],['autoFlySpeed','巡航速度',0,80,.5,15,{shader:false}],['autoTurn','巡航转弯',0,1,.01,.12,{shader:false}],['cameraBob','镜头浮动',0,2,.01,.28,{shader:false}],['renderScale','渲染比例',.35,1,.05,.8,{shader:false}],['pixelRatio','像素密度',.5,2,.1,1,{shader:false}],['maxFPS','帧率上限',20,120,1,60,{shader:false}],['viewDistance','视距',180,1400,10,780],['raySteps','步进质量',.35,1,.01,.78],['shadowQuality','阴影质量',0,1,.01,.68],['cloudQuality','云层质量',0,1,.01,.62],['dynamicResolution','动态分辨率',0,1,1,1,{type:'check',shader:false}],['showHUD','显示状态栏',0,1,1,1,{type:'check',shader:false}]

];
const params={}, defaults={}, gpuDefs=[], flat=[];
groups.forEach(g=>g.items.forEach(a=>{const [id,label,min,max,step,def,opt={}] = a, p={id,label,min,max,step,def,...opt,group:g.id};if(p.shader!==false){p.gpu=gpuDefs.length;gpuDefs.push(p)}flat.push(p);params[id]=def;defaults[id]=def}));
const P=id=>`p[${paramsMeta(id).gpu}]`, paramsMeta=id=>flat.find(x=>x.id===id);
document.querySelector('#paramCount').textContent=flat.length+' 项';

const vsrc=`#version 300 es
precision highp float;out vec2 vUv;void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);vUv=p;gl_Position=vec4(p*2.0-1.0,0,1);}`;
const fsrc=`#version 300 es
precision highp float;precision highp int;out vec4 frag;in vec2 vUv;
uniform vec2 uRes;uniform float uTime;uniform float uFocal;uniform vec3 uCam;uniform mat3 uCamMat;uniform vec3 uSun;uniform vec3 uMoon;uniform float uLightning;uniform float p[${gpuDefs.length}];
#define PI 3.14159265359
#define SAT(x) clamp(x,0.0,1.0)
float hash11(float x){return fract(sin(x*127.1)*43758.5453123);}
float hash21(vec2 x){return fract(sin(dot(x,vec2(127.1,311.7)))*43758.5453123);}
vec2 hash22(vec2 x){return fract(sin(vec2(dot(x,vec2(127.1,311.7)),dot(x,vec2(269.5,183.3))))*43758.5453);}
float noise(vec2 x){vec2 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);return mix(mix(hash21(i),hash21(i+vec2(1,0)),f.x),mix(hash21(i+vec2(0,1)),hash21(i+1.),f.x),f.y);}
float fbm(vec2 x){float f=0.,a=.5;mat2 m=mat2(.8,.6,-.6,.8);for(int i=0;i<5;i++){f+=a*noise(x);x=m*x*2.03+17.1;a*=.5;}return f;}
vec3 hsv(float h,float s,float v){vec3 c=clamp(abs(mod(h*6.+vec3(0,4,2),6.)-3.)-1.,0.,1.);return v*mix(vec3(1),c,s);}
float sdBox(vec3 q,vec3 b,float r){q=abs(q)-b;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.)-r;}
struct Lot{vec2 q,id,center;float road,river,park,plaza,h,w,d,rnd,glass;};
Lot getLot(vec3 x){
 float bs=${P('blockSize')},rw=${P('roadWidth')},pitch=bs+rw;vec2 bid=floor((x.xz+pitch*.5)/pitch);vec2 bq=mod(x.xz+pitch*.5,pitch)-pitch*.5;
 float ave=step(mod(abs(bid.x+bid.y*3.),max(2.,floor(${P('avenueEvery')}))),.1)*${P('avenueWidth')};float inside=step(max(abs(bq.x),abs(bq.y)),bs*.5-ave*.5);
 float ls=${P('lotSize')};vec2 lid=floor((bq+bs*.5)/ls);vec2 lq=mod(bq+bs*.5,ls)-ls*.5;vec2 id=bid*97.+lid;vec2 center=x.xz-lq;
 float seed=${P('seed')}*1.731;float r=hash21(id+seed),r2=hash21(id*2.31-seed),r3=hash21(id*5.13+seed);
 float riverD=abs(center.x-sin(center.y*.0037+seed)*${P('riverBend')});float river=step(riverD,${P('riverWidth')}*.5);
 float park=step(r,${P('parkRate')})*inside*(1.-river),plaza=step(${P('parkRate')},r)*step(r,${P('parkRate')}+${P('plazaRate')})*inside*(1.-river);
 float district=mix(1.,.45+1.25*noise(center/${P('districtScale')}+seed),${P('districtMix')});float core=exp(-length(center)/${P('downtownRadius')})*${P('downtownBoost')};
 float occ=step(r2,${P('density')})*inside*(1.-river)*(1.-park)*(1.-plaza);float h=${P('minHeight')}+pow(r3,max(.1,${P('heightCurve')}))*(${P('maxHeight')}-${P('minHeight')});h*=district*(1.+core);h*=mix(.55,1.55,step(1.-${P('towerChance')},hash21(id*9.7+3.)));
 float w=ls*${P('coverage')}*mix(.72,1.,hash21(id+77.));float d=ls*${P('coverage')}*mix(.72,1.,hash21(id+91.));
 Lot L;L.q=lq;L.id=id;L.center=center;L.road=1.-inside;L.river=river;L.park=park;L.plaza=plaza;L.h=h*occ;L.w=w;L.d=d;L.rnd=${P('roundness')};L.glass=step(hash21(id+43.),${P('glassAmount')});return L;
}
vec2 mapCity(vec3 x){

document.querySelector('#randomize').onclick=()=>{apply({seed:Math.random()*999,timeOfDay:Math.random()*24,density:.6+Math.random()*.38,maxHeight:70+Math.random()*150,downtownBoost:.3+Math.random()*1.8,facadeHue:Math.random(),neonAmount:Math.random()*.75,cloudCoverage:Math.random()*.8,fogDensity:Math.random()*.005,wetness:Math.random(),temperature:(Math.random()-.5)*.4});toast('已生成新的城市情绪')};
document.querySelector('#export').onclick=()=>{let b=new Blob([JSON.stringify({engine:'Skyline Engine',version:1,params},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='skyline-city-preset.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
document.querySelector('#import').onclick=()=>document.querySelector('#fileInput').click();document.querySelector('#fileInput').onchange=async e=>{try{let o=JSON.parse(await e.target.files[0].text());apply(o.params||o);toast('预设导入成功')}catch(err){toast('预设文件无效')}};
document.querySelector('#help').onclick=()=>toast('WASD 移动 · Q/E 升降 · 拖拽环顾 · Shift 加速 · P 暂停时间 · H 隐藏界面');
document.querySelector('#toggle').onclick=()=>panel.classList.toggle('hidden');document.querySelector('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
document.querySelector('#photo').onclick=()=>{let a=document.createElement('a');a.download='skyline-'+Date.now()+'.png';a.href=canvas.toDataURL('image/png');a.click();toast('画面已保存')};
function toast(s){toastEl.textContent=s;toastEl.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>toastEl.classList.remove('show'),2200)}

let cam={x:33.8,y:52,z:-16,yaw:.05,pitch:-.09},keys={},drag=false,lastX=0,lastY=0,lastFrame=0,lastRender=0,fps=60,fpsAcc=0,fpsN=0,fpsStamp=0,adaptive=1,lightning=0;
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyH'){panel.classList.toggle('hidden');document.querySelector('#hint').style.opacity=panel.classList.contains('hidden')?'0':'1'}if(e.code==='KeyP')setParam('pauseTime',params.pauseTime?0:1)});addEventListener('keyup',e=>keys[e.code]=false);
canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointermove',e=>{if(!drag)return;cam.yaw-=(e.clientX-lastX)*params.mouseSensitivity*.009;cam.pitch-=(e.clientY-lastY)*params.mouseSensitivity*.009;cam.pitch=Math.max(-1.35,Math.min(1.35,cam.pitch));lastX=e.clientX;lastY=e.clientY});canvas.addEventListener('wheel',e=>{cam.y=Math.max(2,cam.y+e.deltaY*.02)},{passive:true});
function resize(){let pr=Math.min(2,devicePixelRatio*params.pixelRatio),scale=params.renderScale*adaptive,w=Math.max(320,Math.floor(innerWidth*pr*scale)),h=Math.max(180,Math.floor(innerHeight*pr*scale));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';resizeTarget(w,h)}}addEventListener('resize',resize);
function sunPosition(){let lat=params.latitude*Math.PI/180,dec=-23.44*Math.cos((params.dayOfYear+10)/365*Math.PI*2)*Math.PI/180,h=(params.timeOfDay-12)*15*Math.PI/180;let y=Math.sin(lat)*Math.sin(dec)+Math.cos(lat)*Math.cos(dec)*Math.cos(h),alt=Math.asin(y),az=Math.atan2(Math.sin(h),Math.cos(h)*Math.sin(lat)-Math.tan(dec)*Math.cos(lat))+params.northOffset*Math.PI/180,ca=Math.cos(alt);return [Math.sin(az)*ca,Math.sin(alt),Math.cos(az)*ca]}
function mat3(){let cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);let f=[sy*cp,sp,cy*cp],r=[cy,0,-sy],u=[-sy*sp,cp,-cy*sp];return new Float32Array([r[0],r[1],r[2],u[0],u[1],u[2],f[0],f[1],f[2]])}
function render(now,force=false){requestAnimationFrame(render);let dt=Math.min(.05,(now-lastFrame)/1000||.016);lastFrame=now;if(!force&&now-lastRender<1000/params.maxFPS)return;lastRender=now;
 if(!params.pauseTime)params.timeOfDay=(params.timeOfDay+dt*params.timeSpeed/3600)%24;let tp=paramsMeta('timeOfDay');tp.el.value=params.timeOfDay;tp.out.textContent=format(tp,params.timeOfDay);
 let speed=params.cameraSpeed*(keys.ShiftLeft||keys.ShiftRight?params.sprintMultiplier:1),mx=(keys.KeyD?1:0)-(keys.KeyA?1:0),mz=(keys.KeyW?1:0)-(keys.KeyS?1:0),my=(keys.KeyE?1:0)-(keys.KeyQ?1:0);if(params.autoFly&&!mx&&!mz){mz=params.autoFlySpeed/Math.max(1,params.cameraSpeed);cam.yaw+=Math.sin(now*.00007)*params.autoTurn*dt*.12}
 cam.x+=(Math.sin(cam.yaw)*mz+Math.cos(cam.yaw)*mx)*speed*dt;cam.z+=(Math.cos(cam.yaw)*mz-Math.sin(cam.yaw)*mx)*speed*dt;cam.y=Math.max(2.2,cam.y+my*speed*dt+Math.sin(now*.0017)*params.cameraBob*dt);
 if(params.storm>0&&Math.random()<params.lightningRate*params.storm*dt*.13)lightning=1;lightning=Math.max(0,lightning-dt*3.4);
 syncGPU();resize();let sun=sunPosition(),moon=sun.map(v=>-v);
 gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);gl.viewport(0,0,fbW,fbH);gl.useProgram(sceneProg);gl.uniform2f(su.res,fbW,fbH);gl.uniform1f(su.time,now*.001);gl.uniform1f(su.focal,.5/Math.tan(params.fov*Math.PI/360));gl.uniform3f(su.cam,cam.x,cam.y,cam.z);gl.uniformMatrix3fv(su.mat,false,mat3());gl.uniform3fv(su.sun,sun);gl.uniform3fv(su.moon,moon);gl.uniform1f(su.lightning,lightning);gl.uniform1fv(su.p,gpuValues);gl.drawArrays(gl.TRIANGLES,0,3);
 gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,canvas.width,canvas.height);gl.useProgram(postProg);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,texScene);gl.uniform1i(pu.scene,0);gl.uniform2f(pu.res,canvas.width,canvas.height);gl.uniform1f(pu.time,now*.001);gl.uniform1fv(pu.p,gpuValues);gl.drawArrays(gl.TRIANGLES,0,3);
 fpsAcc+=1/dt;fpsN++;if(now-fpsStamp>500){fps=fpsAcc/fpsN;fpsAcc=fpsN=0;fpsStamp=now;document.querySelector('#perf').textContent=Math.round(fps)+' FPS';if(params.dynamicResolution){if(fps<params.maxFPS*.58&&adaptive>.56)adaptive-=.05;else if(fps>params.maxFPS*.88&&adaptive<1)adaptive+=.025}}
 let hh=Math.floor(params.timeOfDay),mm=Math.floor((params.timeOfDay-hh)*60);document.querySelector('#clock').textContent=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');document.querySelector('#weatherChip').textContent=params.rain>.4?'降雨':params.snow>.3?'降雪':params.storm>.3?'风暴':params.cloudCoverage>.65?'阴云':params.cloudCoverage>.3?'多云':'晴朗';
}
syncGPU();resize();requestAnimationFrame(render);setTimeout(()=>{let l=document.querySelector('#loading');l.style.opacity=0;setTimeout(()=>l.remove(),550)},450);setTimeout(()=>document.querySelector('#hint').style.opacity=.35,8000);
})();
</script>
