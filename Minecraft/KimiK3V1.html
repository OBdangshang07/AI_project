<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minecraft · Web Edition</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:"Courier New",monospace;color:#fff}
#c{position:fixed;inset:0;display:block}
.screen{position:fixed;inset:0;display:none;z-index:50}
.screen.on{display:flex;flex-direction:column;align-items:center;justify-content:center}
.panelbg{background:rgba(12,12,16,.82);border:2px solid #555;border-top-color:#8a8a8a;border-left-color:#8a8a8a;padding:14px 18px;box-shadow:0 6px 24px rgba(0,0,0,.6)}
h1.logo{font-size:52px;letter-spacing:2px;color:#eee;text-shadow:3px 3px 0 #3a3a3a,6px 6px 0 rgba(0,0,0,.5);margin-bottom:4px;font-weight:900}
.sub{color:#ff5;font-size:14px;margin-bottom:18px;text-shadow:1px 1px 0 #000}
.mcbtn{display:block;width:300px;margin:6px auto;padding:10px 0;text-align:center;font-family:inherit;font-size:15px;font-weight:700;color:#eee;cursor:pointer;
 background:linear-gradient(#8f8f8f,#6f6f6f 45%,#5f5f5f);border:2px solid #000;box-shadow:inset 2px 2px 0 rgba(255,255,255,.35),inset -2px -2px 0 rgba(0,0,0,.4);text-shadow:1px 1px 0 #3a3a3a}
.mcbtn:hover{background:linear-gradient(#7d9fd0,#5f7fb0 45%,#4f6f9a);color:#ffffa0}
.mcbtn.small{width:200px;font-size:13px;padding:7px 0}
.mcbtn.warn:hover{background:linear-gradient(#c07d7d,#a05f5f 45%,#9a4f4f)}
.mcbtn:disabled{opacity:.45;cursor:default}
input.mc,select.mc{background:#1a1a1a;border:2px solid #555;color:#eee;font-family:inherit;font-size:14px;padding:6px 8px;width:300px;outline:none}
input.mc:focus{border-color:#aaa}
.row{display:flex;gap:8px;align-items:center;justify-content:center;margin:5px 0}
label.lbl{width:130px;text-align:right;font-size:13px;color:#ccc}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;display:none}
#crosshair{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);mix-blend-mode:difference}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:#ddd}
#crosshair:before{left:10px;top:0;width:2px;height:22px}
#crosshair:after{top:10px;left:0;height:2px;width:22px}
#hotbar{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);display:flex}
.hbslot{width:46px;height:46px;background:rgba(0,0,0,.45);border:2px solid #585858;border-top-color:#2f2f2f;border-left-color:#2f2f2f;position:relative;margin:0 1px}
.hbslot.sel{border-color:#fff;box-shadow:0 0 6px rgba(255,255,255,.6)}
#bars{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);width:416px;display:flex;justify-content:space-between}
.icrow{display:flex}
.ic{width:16px;height:16px;margin:0 -1px;background-size:16px 16px;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.7))}
#xpwrap{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);width:400px;height:5px;background:#222;border:1px solid #000}
#xpfill{height:100%;width:0%;background:#7efc20}
#xplv{position:absolute;left:50%;bottom:60px;transform:translateX(-50%);color:#7efc20;font-size:14px;font-weight:700;text-shadow:1px 1px 0 #000}
#itemName{position:absolute;left:50%;bottom:66px;transform:translateX(-50%);font-size:16px;font-weight:700;text-shadow:2px 2px 0 #000;opacity:0;transition:opacity .3s}
#debug{position:absolute;left:6px;top:6px;font-size:12px;line-height:15px;color:#fff;text-shadow:1px 1px 0 #000;white-space:pre;display:none}
#chatlog{position:absolute;left:8px;bottom:70px;width:520px;max-height:260px;overflow:hidden;font-size:13px;line-height:17px;text-shadow:1px 1px 0 #000;display:flex;flex-direction:column;justify-content:flex-end}
#chatlog div{background:rgba(0,0,0,.35);padding:1px 4px;margin-top:1px;word-break:break-all}
#chatinput{position:absolute;left:8px;bottom:40px;width:520px;display:none;background:rgba(0,0,0,.6);border:1px solid #888;color:#fff;font-family:inherit;font-size:13px;padding:4px 6px;outline:none}
#toast{position:absolute;left:50%;top:12%;transform:translateX(-50%);font-size:15px;color:#ffe;text-shadow:1px 1px 0 #000;opacity:0;transition:opacity .4s}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:9;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
#dmgflash{position:fixed;inset:0;pointer-events:none;z-index:11;background:rgba(255,0,0,.35);opacity:0;transition:opacity .1s}
#waterov{position:fixed;inset:0;pointer-events:none;z-index:8;background:rgba(20,60,160,.28);display:none}
/* ---------- Inventory / containers ---------- */
.invgrid{display:grid;grid-template-columns:repeat(9,38px);gap:2px}
.slot{width:38px;height:38px;background:#8b8b8b;border:2px solid;border-color:#373737 #fff #fff #373737;position:relative;cursor:pointer}
.slot:hover{background:#a5a5a5}
.slot .icon{position:absolute;inset:2px;background-size:cover;image-rendering:pixelated;pointer-events:none}
.slot .cnt{position:absolute;right:1px;bottom:0;font-size:13px;font-weight:700;color:#fff;text-shadow:1px 1px 0 #000;pointer-events:none}
.slot .dur{position:absolute;left:3px;right:3px;bottom:2px;height:3px;background:#000;pointer-events:none}
.slot .dur i{display:block;height:100%;background:#0f0}
.slot.armor .ph{position:absolute;inset:6px;opacity:.25;background-size:cover;image-rendering:pixelated}
.slot.enc .icon{filter:drop-shadow(0 0 3px #c26bff) saturate(1.4)}
.invlabel{font-size:12px;color:#ddd;margin:8px 0 3px;text-shadow:1px 1px 0 #000}
#heldIcon{position:fixed;width:38px;height:38px;pointer-events:none;z-index:99;display:none;background-size:cover;image-rendering:pixelated}
.craftwrap{display:flex;align-items:center;gap:14px}
.craftgrid{display:grid;gap:2px}
.arrow{font-size:26px;color:#ccc}
#fprog{width:26px;height:16px;background:#333;position:relative;overflow:hidden}
#fprog i{position:absolute;inset:0;width:0%;background:#e80}
#fburn{width:12px;height:12px;margin:2px auto;background:#442}
#fburn.on{background:#f80;box-shadow:0 0 6px #f80}
#creativeScreen .panelbg{max-height:86vh;overflow:hidden;display:flex;flex-direction:column}
#creGrid{overflow-y:auto;max-height:56vh;scrollbar-width:thin;margin-top:8px}
#creGrid .invgrid{grid-template-columns:repeat(9,38px)}
.tabrow{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.tabbtn{font-size:12px;padding:4px 8px;background:#555;border:1px solid #222;cursor:pointer;color:#ddd}
.tabbtn.on{background:#88a;color:#fff}
/* ---------- misc ---------- */
#title{background:linear-gradient(rgba(30,40,60,.55),rgba(5,8,14,.8)),url("") ;backdrop-filter:blur(2px)}
#worldList{width:340px;max-height:180px;overflow-y:auto;margin-bottom:8px}
.witem{padding:7px 10px;background:rgba(255,255,255,.06);border:1px solid #444;margin:3px 0;cursor:pointer;font-size:13px}
.witem:hover{background:rgba(120,150,255,.18)}
.witem .dim{color:#9ab;font-size:11px}
.kv{font-size:12px;color:#bbb;margin:2px 0}
.bigmsg{font-size:42px;font-weight:900;text-shadow:3px 3px 0 #000;margin-bottom:14px}
.dim2{color:#aaa;font-size:13px;margin-bottom:16px;text-shadow:1px 1px 0 #000}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#666}::-webkit-scrollbar-track{background:#222}
kbd{background:#333;border:1px solid #666;border-radius:3px;padding:0 4px;font-size:11px}
</style>
<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div><div id="waterov"></div><div id="dmgflash"></div>

<div id="hud">
  <div id="crosshair"></div>
  <div id="debug"></div>
  <div id="chatlog"></div>
  <input id="chatinput" maxlength="256">
  <div id="bars">
    <div class="icrow" id="hearts"></div>
    <div class="icrow" id="foods"></div>
  </div>
  <div id="xpwrap"><div id="xpfill"></div></div><div id="xplv"></div>
  <div id="itemName"></div>
  <div id="hotbar"></div>
  <div id="toast"></div>
</div>

<div id="title" class="screen on">
  <h1 class="logo">MINECRAFT</h1>
  <div class="sub">Web Edition · 单文件版 · 最远 8192 格视距</div>
  <div class="panelbg" style="width:380px">
    <div class="invlabel">我的存档</div>
    <div id="worldList"></div>
    <div class="invlabel">创建新世界</div>
    <div class="row"><input id="wName" class="mc" value="新的世界" style="width:160px"><input id="wSeed" class="mc" placeholder="种子(留空随机)" style="width:150px"></div>
    <button class="mcbtn" id="btnCreate">创建并进入世界</button>
    <button class="mcbtn small" id="btnSettings1">设置…</button>
    <div class="kv" style="margin-top:8px">WASD 移动 · 空格跳 · E 背包 · T 聊天 · / 指令 · F3 调试<br>需要联网加载 three.js (CDN)</div>
  </div>
</div>

<div id="pause" class="screen">
  <div class="panelbg" style="text-align:center">
    <div class="bigmsg" style="font-size:26px">游戏菜单</div>
    <button class="mcbtn" id="btnResume">回到游戏</button>
    <div class="row">
      <button class="mcbtn small gmBtn" data-gm="0">生存</button>
      <button class="mcbtn small gmBtn" data-gm="1">创造</button>
    </div>
    <div class="row">
      <button class="mcbtn small gmBtn" data-gm="2">冒险</button>
      <button class="mcbtn small gmBtn" data-gm="3">旁观</button>
    </div>
    <button class="mcbtn" id="btnSettings2">设置…</button>
    <button class="mcbtn warn" id="btnQuit">保存并退出到标题</button>
  </div>
</div>

<div id="death" class="screen" style="background:rgba(120,0,0,.45)">
  <div class="bigmsg">你死了！</div>
  <div class="dim2" id="deathMsg"></div>
  <button class="mcbtn" id="btnRespawn">重生</button>
  <button class="mcbtn small" id="btnDeathTitle">回到标题</button>
</div>

<div id="settings" class="screen">
  <div class="panelbg" style="width:430px">
    <div class="invlabel" style="font-size:16px;margin-bottom:10px">设置</div>
    <div class="row"><label class="lbl">视距</label><input type="range" id="setRD" min="2" max="512" step="1" value="12" style="width:180px"><span class="kv" id="setRDV">192 格</span></div>
    <div class="row"><label class="lbl">视场角 FOV</label><input type="range" id="setFOV" min="50" max="110" value="75" style="width:180px"><span class="kv" id="setFOVV">75</span></div>
    <div class="row"><label class="lbl">鼠标灵敏度</label><input type="range" id="setSens" min="20" max="200" value="100" style="width:180px"><span class="kv" id="setSensV">100%</span></div>
    <div class="row"><label class="lbl">音量</label><input type="range" id="setVol" min="0" max="100" value="60" style="width:180px"><span class="kv" id="setVolV">60%</span></div>
    <div class="row"><label class="lbl">阴影</label><input type="checkbox" id="setShadow" checked><label class="lbl" style="width:auto">泛光(光影)</label><input type="checkbox" id="setBloom" checked></div>
    <div class="row"><label class="lbl">云</label><input type="checkbox" id="setCloud" checked><label class="lbl" style="width:auto">平滑光照/AO</label><input type="checkbox" id="setAO" checked></div>
    <div class="kv" style="margin:6px 0">提示：视距超过 384 格后由远景地形(LOD)绘制，8192 格需要较好的显卡。</div>
    <button class="mcbtn" id="btnCloseSet">完成</button>
  </div>
</div>

<div id="invScreen" class="screen"></div>
<div id="creativeScreen" class="screen"></div>
<div id="chestScreen" class="screen"></div>
<div id="furnaceScreen" class="screen"></div>
<div id="heldIcon"></div>

<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

/* ================= 工具与常量 ================= */
const CH=16, WH=128, SEA=60;                 // 区块边长 / 世界高度 / 海平面
const $=s=>document.querySelector(s);
const el=(t,c,p)=>{const e=document.createElement(t);if(c)e.className=c;if(p)p.appendChild(e);return e};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const floor=Math.floor, abs=Math.abs, min=Math.min, max=Math.max;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0}
/* 经典 Perlin 噪声(2D/3D) */
function makeNoise(seed){
  const rnd=mulberry32(seed), p=new Uint8Array(512), perm=new Uint8Array(256);
  for(let i=0;i<256;i++)perm[i]=i;
  for(let i=255;i>0;i--){const j=(rnd()*(i+1))|0;const t=perm[i];perm[i]=perm[j];perm[j]=t}
  for(let i=0;i<512;i++)p[i]=perm[i&255];
  const fade=t=>t*t*t*(t*(t*6-15)+10), g=(h,x,y,z)=>{const u=h<8?x:y,v=h<4?y:(h===12||h===14?x:z);return((h&1)===0?u:-u)+((h&2)===0?v:-v)};
  function n3(x,y,z){
    const X=floor(x)&255,Y=floor(y)&255,Z=floor(z)&255;
    x-=floor(x);y-=floor(y);z-=floor(z);
    const u=fade(x),v=fade(y),w=fade(z);
    const A=p[X]+Y,AA=p[A]+Z,AB=p[A+1]+Z,B=p[X+1]+Y,BA=p[B]+Z,BB=p[B+1]+Z;
    return lerp(lerp(lerp(g(p[AA]&15,x,y,z),g(p[BA]&15,x-1,y,z),u),lerp(g(p[AB]&15,x,y-1,z),g(p[BB]&15,x-1,y-1,z),u),v),
      lerp(lerp(g(p[AA+1]&15,x,y,z-1),g(p[BA+1]&15,x-1,y,z-1),u),lerp(g(p[AB+1]&15,x,y-1,z-1),g(p[BB+1]&15,x-1,y-1,z-1),u),v),w);
  }
  const n2=(x,y)=>n3(x,y,0.5);
  function o2(x,y,oct){let a=0,f=1,amp=1,norm=0;for(let i=0;i<oct;i++){a+=n2(x*f,y*f)*amp;norm+=amp;amp*=.5;f*=2}return a/norm}
  function o3(x,y,z,oct){let a=0,f=1,amp=1,norm=0;for(let i=0;i<oct;i++){a+=n3(x*f,y*f,z*f)*amp;norm+=amp;amp*=.5;f*=2}return a/norm}
  return {n2,n3,o2,o3};
}
let NZ=makeNoise(1337);            // 当前世界噪声(建世界时重置)
let WSEED=1337;
function h2(x,z){let h=(x*374761393+z*668265263)^(WSEED*974711);h=(h^(h>>13))*1274126177;return((h^(h>>16))>>>0)/4294967296}
function h3(x,y,z){let h=(x*374761393+z*668265263+y*2147483647)^(WSEED*974711);h=(h^(h>>13))*1274126177;return((h^(h>>16))>>>0)/4294967296}
/* ================= 纹理图集(程序化生成) ================= */
const AC=document.createElement('canvas');AC.width=AC.height=512;
const AG=AC.getContext('2d');AG.clearRect(0,0,512,512);
const TEX={};let texCount=0;
function regTex(name,fn){
  const i=texCount++,ox=(i%32)*16,oy=floor(i/32)*16,rnd=mulberry32(hashStr(name));
  const px=(x,y,c)=>{AG.fillStyle=c;AG.fillRect(ox+x,oy+y,1,1)};
  const C={px,rnd,
    noise(pal){for(let y=0;y<16;y++)for(let x=0;x<16;x++)px(x,y,pal[(rnd()*pal.length)|0])},
    speck(c,n){for(let i=0;i<n;i++)px((rnd()*16)|0,(rnd()*16)|0,c)},
    rect(x,y,w,h,c){AG.fillStyle=c;AG.fillRect(ox+x,oy+y,w,h)},
    hole(x,y){AG.clearRect(ox+x,oy+y,1,1)},
    ring(cx,cy,r,c){for(let y=0;y<16;y++)for(let x=0;x<16;x++){const d=(x-cx)*(x-cx)+(y-cy)*(y-cy);if(d<=r*r&&d>=(r-1.4)*(r-1.4))px(x,y,c)}},
  };
  fn(C);TEX[name]=i;
}
function shade(hex,f){const n=parseInt(hex.slice(1),16),r=clamp(((n>>16)&255)*f,0,255)|0,g=clamp(((n>>8)&255)*f,0,255)|0,b=clamp((n&255)*f,0,255)|0;return`rgb(${r},${g},${b})`}
function pal(base,n=4,f=.12){const a=[];for(let i=0;i<n;i++)a.push(shade(base,1+(i/(n-1)-.5)*2*f));return a}
/* ---- 基础地形 ---- */
regTex('stone',c=>c.noise(pal('#7d7d7d',5,.09)));
regTex('cobblestone',c=>{c.noise(pal('#8a8a8a',4,.15));for(let i=0;i<9;i++){const x=(c.rnd()*13)|0,y=(c.rnd()*13)|0;c.rect(x,y,2+(c.rnd()*2|0),2+(c.rnd()*2|0),'#666')}});
regTex('mossy_cobblestone',c=>{c.noise(pal('#8a8a8a',4,.15));for(let i=0;i<9;i++){const x=(c.rnd()*13)|0,y=(c.rnd()*13)|0;c.rect(x,y,2,2,'#5a7a3a')}c.speck('#4a6a2a',22)});
regTex('stone_bricks',c=>{c.noise(pal('#7a7a7a',3,.06));c.rect(0,3,16,1,'#565656');c.rect(0,7,16,1,'#565656');c.rect(0,11,16,1,'#565656');c.rect(7,0,1,3,'#565656');c.rect(3,4,1,3,'#565656');c.rect(11,4,1,3,'#565656');c.rect(7,8,1,3,'#565656');c.rect(3,12,1,4,'#565656');c.rect(11,12,1,4,'#565656')});
regTex('dirt',c=>c.noise(pal('#866043',5,.16)));
regTex('grass_top',c=>{c.noise(pal('#5fae3f',5,.14));c.speck('#4d9433',30)});
regTex('grass_side',c=>{c.noise(pal('#866043',5,.16));for(let y=0;y<3;y++)for(let x=0;x<16;x++)if(y===0||c.rnd()<.8)c.px(x,y,shade('#5fae3f',1+(c.rnd()-.5)*.24));for(let x=0;x<16;x++)if(c.rnd()<.5)c.px(x,3,'#5fae3f')});
regTex('sand',c=>c.noise(pal('#dbd3a0',4,.07)));
regTex('sandstone_top',c=>c.noise(pal('#d8cf9b',3,.05)));
regTex('sandstone_side',c=>{c.noise(pal('#d8cf9b',3,.05));c.rect(0,12,16,2,'#c9bf8a');c.rect(0,2,16,1,'#c9bf8a')});
regTex('gravel',c=>c.noise(['#8a837c','#7a736c','#9a938c','#6b655f','#a39d96']));
regTex('clay',c=>c.noise(pal('#9fa4b1',4,.05)));
regTex('bedrock',c=>c.noise(['#555','#333','#777','#222','#555']));
regTex('snow',c=>c.noise(pal('#f2fbfb',3,.03)));
regTex('ice',c=>{AG.fillStyle='rgba(146,183,253,.55)';AG.fillRect(0,0,16,16);c.noise(['rgba(146,183,253,.5)','rgba(170,200,255,.55)','rgba(130,170,245,.5)']);c.speck('rgba(255,255,255,.7)',12)});
regTex('packed_ice',c=>{c.noise(pal('#8db4f2',4,.08));c.speck('#a8c8f8',10)});
/* ---- 木头 ---- */
function logSide(bark){return c=>{c.noise(pal(bark,4,.13));for(let x=0;x<16;x+=4)c.rect(x,0,1,16,shade(bark,.75))}}
function logTop(c1,c2){return c=>{c.rect(0,0,16,16,c2);c.ring(7.5,7.5,6.5,c1);c.ring(7.5,7.5,4.5,c1);c.ring(7.5,7.5,2.5,c1);c.rect(7,7,2,2,c1)}}
function planks(base){return c=>{c.noise(pal(base,3,.07));c.rect(0,3,16,1,shade(base,.72));c.rect(0,7,16,1,shade(base,.72));c.rect(0,11,16,1,shade(base,.72));c.rect(5,0,1,3,shade(base,.72));c.rect(11,4,1,3,shade(base,.72));c.rect(2,8,1,3,shade(base,.72));c.rect(9,12,1,4,shade(base,.72))}}

const B=[],BID={};
function defBlock(key,o){
  const id=B.length;BID[key]=id;
  const d=Object.assign({id,key,name:key,tex:'stone',geo:'cube',opaque:true,hard:1,tool:null,tier:0,lum:0,
    drop:undefined,dropTier:0,noCollide:false,replaceable:false,liquid:null,dmg:0,cullSame:false,slip:0,bounce:0},o);
  if(typeof d.tex==='string')d.tex={all:d.tex};
  d.texTop=d.tex.top||d.tex.all;d.texSide=d.tex.side||d.tex.all;d.texBottom=d.tex.bottom||d.tex.all;
  B.push(d);return id;
}

function avgTileColor(name){const i=TEX[name];
  if(i===undefined){console.error('avgTileColor: missing tex',name);return[1,0,1]}
  const ox=(i%32)*16,oy=floor(i/32)*16,d=AG.getImageData(ox,oy,16,16).data;let r=0,g=0,b=0,n=0;
  for(let p=0;p<d.length;p+=4){if(d[p+3]>80){r+=d[p];g+=d[p+1];b+=d[p+2];n++}}return n?[r/n/255,g/n/255,b/n/255]:[1,0,1]}

  }}}

function biomeTH(x,z){
  return {t:NZ.o2(x*0.0021+53.7,z*0.0021-31.2,3), h:NZ.o2(x*0.0023-17.9,z*0.0023+87.4,3)};
}
function heightAt(x,z){
  const c=NZ.o2(x*0.0011,z*0.0011,4);
  let y=SEA+5+c*15+NZ.o2(x*0.013,z*0.013,2)*3;
  const m=NZ.o2(x*0.004+311,z*0.004-97,3);
  if(m>0.3)y+=(m-0.3)*115;
  y+=NZ.o2(x*0.05,z*0.05,2)*1.5;
  return clamp(floor(y),4,WH-10);
}
function biomeAt(x,z,y){
  const{t,h}=biomeTH(x,z);
  if(y===undefined)y=heightAt(x,z);
  if(y<SEA-2)return{key:'ocean',name:'海洋'};
  if(y>100)return{key:'mountains',name:'山地'};
  if(t>0.45&&h<0.1)return{key:'desert',name:'沙漠'};
  if(t>0.5)return{key:'savanna',name:'热带草原'};
  if(t<-0.35)return{key:'taiga',name:'针叶林'};
  if(h>0.45)return{key:'birch_forest',name:'白桦森林'};
  if(h>0.2)return{key:'forest',name:'森林'};
  return{key:'plains',name:'平原'};
}
const IDX=(x,y,z)=>(y<<8)|(z<<4)|x;
function genChunk(cx,cz){
  const data=new Uint8Array(CH*WH*CH);
  const baseX=cx*16,baseZ=cz*16;
  for(let lx=0;lx<16;lx++)for(let lz=0;lz<16;lz++){
    const wx=baseX+lx,wz=baseZ+lz,top=heightAt(wx,wz),bio=biomeAt(wx,wz,top);
    const cold=bio.key==='taiga'||(bio.key==='mountains'&&top>108);
    /* 基岩 */
    data[IDX(lx,0,lz)]=BID.bedrock;
    if(h3(wx,1,wz)<0.7)data[IDX(lx,1,lz)]=BID.bedrock;
    if(h3(wx,2,wz)<0.4)data[IDX(lx,2,lz)]=BID.bedrock;
    if(h3(wx,3,wz)<0.15)data[IDX(lx,3,lz)]=BID.bedrock;
    /* 主体 */
    for(let y=4;y<=top;y++){
      let id=BID.stone;
      if(y<8&&h3(wx,y,wz)<0.5)id=BID.deepslate;
      data[IDX(lx,y,lz)]=id;
    }
    /* 表层 */
    const beach=top<=SEA+1;
    let topId=BID.grass_block,subId=BID.dirt;
    if(bio.key==='desert'||beach){topId=BID.sand;subId=BID.sand}
    else if(bio.key==='ocean'){const r=h2(wx,wz);topId=r<0.4?BID.sand:(r<0.7?BID.gravel:BID.clay);subId=topId}
    else if(bio.key==='mountains'){topId=top>104?BID.stone:BID.grass_block;subId=BID.stone}
    for(let y=max(4,top-3);y<=top;y++){
      if(y===top)data[IDX(lx,y,lz)]=topId;
      else if(data[IDX(lx,y,lz)]===BID.stone||data[IDX(lx,y,lz)]===BID.deepslate)data[IDX(lx,y,lz)]=subId;
    }
    if(bio.key==='desert'){const y=top-4;if(y>=4)data[IDX(lx,y,lz)]=BID.sandstone}
    if(cold&&top>=SEA&&top<WH-2&&bio.key!=='mountains')data[IDX(lx,top+1,lz)]=BID.snow_layer;
    if(bio.key==='mountains'&&top>106)data[IDX(lx,top,lz)]=BID.snow_block;
    /* 水 */
    if(top<SEA){for(let y=top+1;y<=SEA;y++)data[IDX(lx,y,lz)]=BID.water;
      if(cold||biomeTH(wx,wz).t<-0.42)data[IDX(lx,SEA,lz)]=BID.ice}
    /* 矿物 */
    for(let y=4;y<top-2;y++){
      if(data[IDX(lx,y,lz)]!==BID.stone&&data[IDX(lx,y,lz)]!==BID.deepslate)continue;
      const r=h3(wx*3+1,y,wz*3+7),deep=data[IDX(lx,y,lz)]===BID.deepslate;
      let id=0;
      if(r<0.0009&&y<16)id=deep?BID.deepslate_diamond_ore:BID.diamond_ore;
      else if(r<0.0021&&y<32)id=deep?BID.deepslate_gold_ore:BID.gold_ore;
      else if(r<0.0033&&y<20)id=BID.redstone_ore;
      else if(r<0.0043&&y<32)id=BID.lapis_ore;
      else if(r<0.0047&&y<32&&bio.key==='mountains')id=BID.emerald_ore;
      else if(r<0.0107&&y<64)id=deep?BID.deepslate_iron_ore:BID.iron_ore;
      else if(r<0.0137&&y<48)id=BID.copper_ore;
      else if(r<0.0217&&y<96)id=deep?BID.deepslate_coal_ore:BID.coal_ore;
      else if(r<0.0257)id=BID.dirt;
      else if(r<0.0287)id=BID.gravel;
      if(id)data[IDX(lx,y,lz)]=id;
    }
    /* 洞穴 */
    for(let y=5;y<min(top-2,56);y++){
      const v=NZ.o3(wx*0.032,y*0.05,wz*0.032,3);
      if(v>0.52){
        const cur=data[IDX(lx,y,lz)];
        if(cur!==BID.bedrock&&cur!==BID.water)data[IDX(lx,y,lz)]=y<=10?BID.lava:BID.air;
      }
    }
  }
  /* 树木/植被(逐网格抖动) */
  const CELL=7;
  for(let cellX=floor((baseX-12)/CELL);cellX<=floor((baseX+27)/CELL);cellX++)
  for(let cellZ=floor((baseZ-12)/CELL);cellZ<=floor((baseZ+27)/CELL);cellZ++){
    const r0=h2(cellX*811,cellZ*911);
    const tx=cellX*CELL+1+((h2(cellX*31,cellZ*17)* (CELL-3))|0);
    const tz=cellZ*CELL+1+((h2(cellX*77,cellZ*41)* (CELL-3))|0);
    if(tx<baseX||tx>=baseX+16||tz<baseZ||tz>=baseZ+16)continue;
    const top=heightAt(tx,tz),bio=biomeAt(tx,tz,top);
    if(top<=SEA||top+12>=WH)continue;
    const lx=tx-baseX,lz=tz-baseZ;
    const place=(x,y,z,id,overwrite)=>{if(x<0||x>15||z<0||z>15||y<1||y>=WH)return;const i=IDX(x,y,z);if(overwrite||data[i]===0||B[data[i]].leaf)data[i]=id};
    const put=(x,y,z,id)=>place(x,y,z,id,false);
    if(bio.key==='desert'){
      if(r0<0.02&&data[IDX(lx,top,lz)]===BID.sand){const hgt=1+(h2(tx,tz)*3|0);for(let i=1;i<=hgt;i++)put(lx,top+i,lz,BID.cactus)}
      continue;
    }
    const dens={plains:0.02,forest:0.16,birch_forest:0.14,taiga:0.11,savanna:0.012,mountains:0.01,ocean:0}[bio.key]||0;
    if(r0>dens)continue;
    if(data[IDX(lx,top,lz)]!==BID.grass_block&&data[IDX(lx,top,lz)]!==BID.snow_block&&data[IDX(lx,top,lz)]!==BID.dirt)continue;
    const tr=h2(tx*3,tz*7);
    if(bio.key==='taiga'){
      const hgt=6+(tr*3|0),log=BID.spruce_log,leaf=BID.spruce_leaves;
      for(let i=1;i<=hgt;i++)put(lx,top+i,lz,log);
      for(let ly=top+3;ly<=top+hgt;ly++){const rad=ly===top+hgt?0:(ly%2===0?2:1);
        for(let dx=-rad;dx<=rad;dx++)for(let dz=-rad;dz<=rad;dz++){if(dx===0&&dz===0)continue;if(abs(dx)===abs(dz)&&rad===2&&h3(tx+dx,ly,tz+dz)<0.4)continue;put(lx+dx,ly,lz+dz,leaf)}}
      put(lx,top+hgt+1,lz,leaf);
    }else{
      const birch=bio.key==='birch_forest',jungle=bio.key==='forest'&&tr<0.05;
      const hgt=jungle?7+(tr*4|0):(birch?5+(tr*3|0):4+(tr*3|0));
      const log=jungle?BID.jungle_log:(birch?BID.birch_log:BID.oak_log);
      const leaf=jungle?BID.jungle_leaves:(birch?BID.birch_leaves:BID.oak_leaves);
      for(let i=1;i<=hgt;i++)put(lx,top+i,lz,log);
      for(let ly=top+hgt-2;ly<=top+hgt+1;ly++){
        const rad=ly>top+hgt?1:2;
        for(let dx=-rad;dx<=rad;dx++)for(let dz=-rad;dz<=rad;dz++){
          if(dx===0&&dz===0&&ly<=top+hgt)continue;
          if(abs(dx)===rad&&abs(dz)===rad&&h3(tx+dx,ly,tz+dz)<0.5)continue;
          put(lx+dx,ly,lz+dz,leaf);
        }
      }
    }
  }

/* ================= 区块流送 ================= */
function nearR(){return clamp(SET.rd,2,32)}
function spiralChunks(pcx,pcz,r){
  const out=[];
  for(let dx=-r;dx<=r;dx++)for(let dz=-r;dz<=r;dz++)out.push([dx,dz,max(abs(dx),abs(dz))]);
  out.sort((a,b)=>a[2]-b[2]);
  return out.map(([dx,dz])=>[pcx+dx,pcz+dz]);
}
let streamIdx=0,streamList=[],lastPC=null;
function updateChunks(dt){
  const pcx=floor(P.pos.x/16),pcz=floor(P.pos.z/16);
  const key=pcx+','+pcz;
  if(key!==lastPC){
    lastPC=key;
    streamList=spiralChunks(pcx,pcz,nearR());
    streamIdx=0;
    lodNeed=computeLODNeeded(pcx,pcz);
  }
  const t0=performance.now();
  const nr=nearR();
  while(performance.now()-t0<7&&streamIdx<streamList.length){
    const[cx,cz]=streamList[streamIdx++];
    const d=max(abs(cx-pcx),abs(cz-pcz));
    const c=ensureChunk(cx,cz);
    if(c.dirty&&d<=nr)buildChunkMesh(c);
  }
  /* 卸载过远区块网格 */
  for(const[k,c]of chunks){
    const d=max(abs(c.cx-pcx),abs(c.cz-pcz));
    if(d>nr+3&&c.meshes.length){
      for(const m of c.meshes){worldGroup.remove(m);m.geometry.dispose()}
      c.meshes=[];
    }
    if(d>nr+8&&!c.modified&&chunks.size>(2*nr+20)*(2*nr+20)){chunks.delete(k)}
  }
  updateLOD(pcx,pcz,4);
  /* 水面动画 */
  waterTex.offset.x=(waterTex.offset.x+dt*0.018)%1;
  waterTex.offset.y=(waterTex.offset.y+dt*0.007)%1;
  lavaTex.offset.y=(lavaTex.offset.y+dt*0.01)%1;
}
/* ================= 玩家 ================= */
const GM_NAMES=['生存','创造','冒险','旁观'];
const P={
  pos:new THREE.Vector3(8.5,90,8.5),vel:new THREE.Vector3(),
  yaw:0,pitch:0,onGround:false,gm:1,fly:false,
  hp:20,maxHp:20,food:20,sat:5,air:20,xp:0,xpLevel:0,
  inv:new Array(36).fill(null),armor:new Array(4).fill(null),
  sel:0,spawn:new THREE.Vector3(8.5,90,8.5),effects:new Map(),
  dead:false,god:false,fallD:0,attackCd:0,sneak:false,
  inWater:false,inLava:false,exh:0,bowDraw:0,eatT:0,burnT:0,hurtCd:0,
  reach:5,
};
const KEYS={};
function gmIs(g){return P.gm===g}
function canFly(){return P.gm===1||P.gm===3||P.flyEnabled===true}
function isSolid(id){return id>0&&!B[id].noCollide&&!B[id].liquid}
function boxCollides(px,py,pz,w,h){
  const x0=floor(px-w),x1=floor(px+w),y0=floor(py),y1=floor(py+h),z0=floor(pz-w),z1=floor(pz+w);
  for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++){
    if(isSolid(getBlockE(x,y,z)))return{x,y,z};
  }
  return null;
}
function moveAxis(ax,amt){
  if(amt===0)return;
  const w=0.3,h=1.8;
  if(ax===0){P.pos.x+=amt;const c=boxCollides(P.pos.x,P.pos.y,P.pos.z,w,h);
    if(c){P.pos.x=amt>0?c.x-w-0.001:c.x+1+w+0.001;P.vel.x=0}}
  else if(ax===2){P.pos.z+=amt;const c=boxCollides(P.pos.x,P.pos.y,P.pos.z,w,h);
    if(c){P.pos.z=amt>0?c.z-w-0.001:c.z+1+w+0.001;P.vel.z=0}}
  else{P.pos.y+=amt;const c=boxCollides(P.pos.x,P.pos.y,P.pos.z,w,h);
    if(c){if(amt<0){P.pos.y=c.y+1;P.onGround=true}else{P.pos.y=c.y-h-0.001}
      P.vel.y=0}}
}
function liquidAt(feet){
  const head=getBlockE(floor(P.pos.x),floor(P.pos.y+1.4),floor(P.pos.z));
  const mid=getBlockE(floor(P.pos.x),floor(P.pos.y+0.5),floor(P.pos.z));
  const h=B[head].liquid,m=B[mid].liquid;
  return h||m||null;
}
function effectLvl(name){const e=P.effects.get(name);return e?e.lvl:0}
function addEffect(name,lvl,sec){P.effects.set(name,{lvl,t:sec})}
function updateEffects(dt){
  for(const[k,e]of P.effects){
    e.t-=dt;
    if(e.t<=0){P.effects.delete(k);continue}
    switch(k){
      case 'regeneration':e.acc=(e.acc||0)+dt*(e.lvl>=2?1.25:0.8);if(e.acc>1){e.acc=0;healPlayer(1)}break;
      case 'poison':e.acc=(e.acc||0)+dt;if(e.acc>1.25){e.acc=0;if(P.hp>1)damagePlayer(1,'中毒')}break;
      case 'levitation':P.vel.y=0.28*e.lvl;break;
    }
  }
}
function healPlayer(n){if(P.gm===1||P.gm===3)return;P.hp=min(P.maxHp,P.hp+n);updateBars()}
function damagePlayer(n,src){
  if(P.dead||P.god||P.gm===1||P.gm===3||n<=0)return;
  if(P.hurtCd>0)return;
  let prot=0;
  for(const a of P.armor)if(a&&IT[a.id].armor)prot+=IT[a.id].armor.prot;
  const eff=1-min(0.8,prot*0.04+effectLvl('resistance')*0.2);
  n=n*eff;
  if(n<0.5&&src!=='void')return;
  P.hp-=n;P.hurtCd=0.4;
  dmgFlash();sfx('hurt');
  updateBars();
  if(P.hp<=0){P.hp=0;killPlayer(src)}
}
function killPlayer(src){
  if(P.dead)return;
  P.dead=true;
  if(!GAMERULES.keepInventory){
    for(let i=0;i<36;i++){if(P.inv[i]){spawnDrop(P.pos.x,P.pos.y+1,P.pos.z,P.inv[i]);P.inv[i]=null}}
    for(let i=0;i<4;i++){if(P.armor[i]){spawnDrop(P.pos.x,P.pos.y+1,P.pos.z,P.armor[i]);P.armor[i]=null}}
    P.xp=0;P.xpLevel=0;
  }
  $('#deathMsg').textContent='死因：'+(src||'未知')+' · 分数 '+P.xpLevel;
  showScreen('death');releasePointer();
  refreshAll();
}
function respawn(){
  P.dead=false;P.hp=P.maxHp;P.food=20;P.sat=5;P.air=20;P.effects.clear();P.burnT=0;
  P.pos.copy(P.spawn);P.vel.set(0,0,0);
  const g=getTopSolid(floor(P.spawn.x),floor(P.spawn.z));
  if(g>0)P.pos.y=g+1;
  showScreen(null);updateBars();
}
function getTopSolid(x,z){
  for(let y=WH-1;y>0;y--){const id=getBlockE(x,y,z);if(isSolid(id)&&!B[id].leaf)return y}
  return SEA;
}
function addExh(n){
  P.exh+=n;
  while(P.exh>=4){P.exh-=4;
    if(P.sat>0)P.sat=max(0,P.sat-1);
    else P.food=max(0,P.food-1);
    updateBars();
  }
}
function updatePlayer(dt){
  if(P.dead)return;
  P.hurtCd=max(0,P.hurtCd-dt);
  updateEffects(dt);
  const spec=P.gm===3;
  const flying=(P.fly&&canFly())||spec;
  const liq=liquidAt();
  P.inWater=liq==='water';P.inLava=liq==='lava';
  /* 移动输入 */
  let ix=0,iz=0;
  if(KEYS.KeyW)iz-=1;if(KEYS.KeyS)iz+=1;
  if(KEYS.KeyA)ix-=1;if(KEYS.KeyD)ix+=1;
  P.sneak=!!KEYS.ShiftLeft&&!flying;
  const sprinting=KEYS.KeyW&&!P.sneak&&(P.food>6||P.gm===1)&&(KEYS.ControlLeft||P.sprintStick);
  let speed=P.inWater?2.2:4.317;
  if(sprinting)speed=5.612;
  if(P.sneak)speed=1.31;
  if(flying)speed=sprinting?21.8:10.89;
  if(effectLvl('speed'))speed*=1+0.2*effectLvl('speed');
  if(effectLvl('slowness'))speed*=max(0.2,1-0.15*effectLvl('slowness'));
  if(P.gm===3)speed=sprinting?43:21.8;
  const sy=Math.sin(P.yaw),cy=Math.cos(P.yaw);
  let mx=(ix*cy-iz*sy),mz=(-iz*cy-ix*sy);
  const ml=Math.hypot(mx,mz)||1;
  mx=mx/ml*speed;mz=mz/ml*speed;
  const acc=flying?0.35:(P.onGround?0.5:(P.inWater||P.inLava)?0.25:0.12);
  P.vel.x+=(mx-P.vel.x)*acc;
  P.vel.z+=(mz-P.vel.z)*acc;
  if(flying){
    const ty=(KEYS.Space?speed:0)+(KEYS.ShiftLeft?-speed:0);
    P.vel.y+=(ty-P.vel.y)*0.4;
  }else if(P.inWater||P.inLava){
    P.vel.y-=30*dt*0.28;
    if(KEYS.Space)P.vel.y=min(P.vel.y+40*dt,P.inWater?3.6:2.4);
    P.vel.y=max(P.vel.y,-8);
    P.vel.x*=0.92;P.vel.z*=0.92;
  }else{
    P.vel.y-=30*dt*(effectLvl('slow_falling')?0.22:1);
    if(effectLvl('slow_falling'))P.vel.y=max(P.vel.y,-3);
    P.vel.y=max(P.vel.y,-70);
  }
  /* 跳跃 */
  if(KEYS.Space&&P.onGround&&!P.inWater&&!P.inLava&&!flying){
    P.vel.y=8.8+effectLvl('jump_boost')*0.9;
    P.onGround=false;addExh(sprinting?0.2:0.05);
  }
  const wasFalling=P.vel.y<0;
  if(!spec){
    const b=P.pos.y;
    moveAxis(0,P.vel.x*dt);
    moveAxis(2,P.vel.z*dt);
    P.onGround=false;
    moveAxis(1,P.vel.y*dt);
    if(P.onGround){
      const below=getBlockE(floor(P.pos.x),floor(P.pos.y-0.01),floor(P.pos.z));
      const bd=B[below];
      if(bd.bounce&&P.vel.y<=0&&wasFalling){P.vel.y=-P.vel.y*bd.bounce;P.onGround=false;P.fallD=0}
      if(bd.slip&&!P.sneak){P.vel.x*=1.02;P.vel.z*=1.02}
    }
    /* 潜行防掉落 */
    if(P.sneak&&P.onGroundPrev&&!P.onGround){
      /* 简单:已在碰撞内,略 */
    }
    /* 摔落 */
    if(P.vel.y<0)P.fallD-=P.vel.y*dt;
    if(P.onGround){
      if(P.fallD>3&&GAMERULES.fallDamage&&(P.gm===0||P.gm===2)&&!effectLvl('slow_falling')){
        const below=getBlockE(floor(P.pos.x),floor(P.pos.y-0.01),floor(P.pos.z));
        if(!B[below].bounce)damagePlayer(floor(P.fallD-3),'摔落');
      }
      P.fallD=0;
    }
    if(P.inWater||P.inLava||flying)P.fallD=0;
  }else{
    P.pos.x+=P.vel.x*dt;P.pos.y+=P.vel.y*dt;P.pos.z+=P.vel.z*dt;
    P.pos.y=clamp(P.pos.y,-8,WH+40);
  }
  P.onGroundPrev=P.onGround;
  /* 虚空 */
  if(P.pos.y<-32){
    if(P.gm===1||P.gm===3){P.pos.y=WH+5;P.vel.set(0,0,0)}
    else{P.hurtCd=0;damagePlayer(1000,'虚空')}
  }
  /* 水/岩浆/空气 */
  if(P.inWater&&P.gm!==1&&P.gm!==3){
    if(effectLvl('water_breathing')){P.air=20}
    else{P.airT=(P.airT||0)+dt;if(P.airT>0.6){P.airT=0;P.air--;updateBars();
      if(P.air<0){P.air=0;if(GAMERULES.drowningDamage)damagePlayer(2,'溺水')}}}
  }else P.air=20;
  if(P.inLava&&P.gm!==1&&P.gm!==3&&GAMERULES.fireDamage&&!effectLvl('fire_resistance')){
    P.burnT=(P.burnT||0)+dt;if(P.burnT>0.5){P.burnT=0;damagePlayer(4,'熔岩')}
  }
  /* 站在岩浆块/仙人掌上 */
  const under=B[getBlockE(floor(P.pos.x),floor(P.pos.y-0.02),floor(P.pos.z))];
  if(under.standDmg&&!P.sneak&&P.gm!==1&&P.gm!==3){P.magmaT=(P.magmaT||0)+dt;if(P.magmaT>0.8){P.magmaT=0;damagePlayer(under.standDmg,'岩浆块')}}
  const inside=B[getBlockE(floor(P.pos.x),floor(P.pos.y+0.3),floor(P.pos.z))];
  if(inside.dmg&&P.gm!==1&&P.gm!==3){P.cacT=(P.cacT||0)+dt;if(P.cacT>0.5){P.cacT=0;damagePlayer(inside.dmg,'仙人掌')}}
  /* 饥饿/回复 */
  if(P.gm===0||P.gm===2){
    if(sprinting&&(abs(P.vel.x)>1||abs(P.vel.z)>1))addExh(dt*0.35);
    if(P.food>=18&&P.hp<P.maxHp&&GAMERULES.naturalRegeneration){
      P.regenT=(P.regenT||0)+dt;
      if(P.regenT>(P.food>=20&&P.sat>0?0.5:4)){P.regenT=0;healPlayer(1);addExh(6)}
    }
    if(P.food<=0){P.starveT=(P.starveT||0)+dt;if(P.starveT>4){P.starveT=0;if(P.hp>1)damagePlayer(1,'饥饿')}}
  }
  /* 相机 */
  camera.position.set(P.pos.x,P.pos.y+(P.sneak?1.45:1.62),P.pos.z);
  camera.rotation.order='YXZ';
  camera.rotation.y=P.yaw;camera.rotation.x=P.pitch;
  /* 水面罩 */
  const headBlock=B[getBlockE(floor(camera.position.x),floor(camera.position.y),floor(camera.position.z))];
  $('#waterov').style.display=headBlock.liquid==='water'?'block':'none';
  if(headBlock.liquid==='lava'){$('#waterov').style.display='block';$('#waterov').style.background='rgba(230,90,10,.5)'}
  else $('#waterov').style.background='rgba(20,60,160,.28)';
  P.attackCd=max(0,P.attackCd-dt);
  updateInteract(dt);
}
/* ================= 射线 ================= */
function rayDir(){return new THREE.Vector3(-Math.sin(P.yaw)*Math.cos(P.pitch),Math.sin(P.pitch),-Math.cos(P.yaw)*Math.cos(P.pitch))}
function raycast(maxD,fluid){
  const o=camera.position,d=rayDir();
  let x=floor(o.x),y=floor(o.y),z=floor(o.z);
  const stX=d.x>0?1:-1,stY=d.y>0?1:-1,stZ=d.z>0?1:-1;
  const tdX=abs(1/(d.x||1e-9)),tdY=abs(1/(d.y||1e-9)),tdZ=abs(1/(d.z||1e-9));
  let tX=(d.x>0?(x+1-o.x):(o.x-x))*tdX,tY=(d.y>0?(y+1-o.y):(o.y-y))*tdY,tZ=(d.z>0?(z+1-o.z):(o.z-z))*tdZ;
  let nx=0,ny=0,nz=0,t=0;
  for(let i=0;i<256;i++){
    if(tX<tY&&tX<tZ){x+=stX;t=tX;tX+=tdX;nx=-stX;ny=0;nz=0}
    else if(tY<tZ){y+=stY;t=tY;tY+=tdY;ny=-stY;nx=0;nz=0}
    else{z+=stZ;t=tZ;tZ+=tdZ;nz=-stZ;nx=0;ny=0}
    if(t>maxD)return null;
    const id=getBlockE(x,y,z);
    if(id===0)continue;
    const def=B[id];
    if(def.liquid&&!fluid)continue;
    if(def.replaceable&&!def.liquid)continue;
    return{x,y,z,nx,ny,nz,id,d:t};
  }
  return null;
}
/* ================= 挖掘/放置/使用 ================= */
let hlBox=null,crackMesh=null,crackTex=null,breakT=0,breakKey='',bowT=0;
function initInteract(){
  hlBox=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1.002,1.002,1.002)),new THREE.LineBasicMaterial({color:0x000000,transparent:true,opacity:.6}));
  hlBox.visible=false;scene.add(hlBox);
  const cv=document.createElement('canvas');cv.width=cv.height=16;
  crackTex=new THREE.CanvasTexture(cv);crackTex.magFilter=THREE.NearestFilter;
  crackMesh=new THREE.Mesh(new THREE.BoxGeometry(1.004,1.004,1.004),new THREE.MeshBasicMaterial({map:crackTex,transparent:true,depthWrite:false}));
  crackMesh.visible=false;scene.add(crackMesh);
  crackMesh.userData.cv=cv;
}
function drawCrack(st){
  const cv=crackMesh.userData.cv,g=cv.getContext('2d');
  g.clearRect(0,0,16,16);
  const rnd=mulberry32(777);
  g.strokeStyle='rgba(10,10,10,.85)';g.lineWidth=1;
  for(let i=0;i<=st;i++){
    g.beginPath();
    let x=rnd()*16,y=rnd()*16;g.moveTo(x,y);
    for(let j=0;j<4;j++){x+=rnd()*6-3;y+=rnd()*6-3;g.lineTo(x,y)}
    g.stroke();
  }
  crackTex.needsUpdate=true;
}
function toolSpeed(def,stack){
  if(!stack)return{s:1,ok:false};
  const it=IT[stack.id];
  if(!it.tool)return{s:1,ok:false};
  if(def.tool&&it.tool.type===def.tool){
    let s=it.tool.speed;
    if(stack.ench&&stack.ench.efficiency)s+=stack.ench.efficiency*stack.ench.efficiency+1;
    return{s,ok:it.tool.tier>=def.dropTier};
  }
  if(def.leaf&&it.tool.type==='shears')return{s:15,ok:true};
  return{s:1,ok:def.dropTier===0};
}
function breakTime(def,stack){
  if(def.hard<=0)return def.hard<0?Infinity:0.001;
  const{s}=toolSpeed(def,stack);
  let t=def.hard*1.5/s;
  if(effectLvl('haste'))t/=1+0.2*effectLvl('haste');
  if(effectLvl('mining_fatigue'))t*=3;
  return t;
}
function updateInteract(dt){
  const hit=raycast(P.gm===1?6:P.reach);
  if(hit&&P.gm!==3){hlBox.visible=true;hlBox.position.set(hit.x+.5,hit.y+.5,hit.z+.5)}
  else hlBox.visible=false;
  /* 挖掘 */
  if(MOUSE[0]&&hit&&P.gm!==3&&P.gm!==2){
    const def=B[hit.id];
    if(def.hard>=0){
      const key=hit.x+','+hit.y+','+hit.z;
      if(key!==breakKey){breakKey=key;breakT=0}
      if(P.gm===1){breakBlock(hit.x,hit.y,hit.z);breakKey=''}
      else{
        const t=breakTime(def,P.inv[P.sel]);
        breakT+=dt;
        crackMesh.visible=true;
        crackMesh.position.set(hit.x+.5,hit.y+.5,hit.z+.5);
        drawCrack(min(9,floor(breakT/t*10)));
        if(breakT>=t){breakBlock(hit.x,hit.y,hit.z);breakKey='';breakT=0;crackMesh.visible=false}
      }
    }else{crackMesh.visible=false}
  }else{crackMesh.visible=false;breakKey='';breakT=0}
  if(MOUSE[0]&&P.gm===2)breakKey='';
  /* 弓拉弦/进食计时 */
  const held=P.inv[P.sel];
  if(MOUSE[2]&&held){
    const it=IT[held.id];
    if(it.use==='bow'){P.bowDraw=min(1.2,P.bowDraw+dt)}
    else if(it.use==='milk'){
      P.eatT+=dt;
      if(P.eatT>1.6){P.effects.clear();P.maxHp=20;replaceSel('bucket');P.eatT=0;sfx('pop')}
    }
    else if(it.food&&(P.food<20||it.food.golden)){
      P.eatT+=dt;
      if(P.eatT>1.6){eatFood(held);P.eatT=0}
    }
  }else P.eatT=0;
}
function eatFood(st){
  const f=IT[st.id].food;
  P.food=min(20,P.food+f.h);P.sat=min(P.food,P.sat+(f.s||f.h));
  if(f.golden){addEffect('regeneration',2,5);addEffect('absorption',1,120);P.maxHp=20}
  if(f.poison)addEffect('poison',1,4);
  consumeSel(1);sfx('eat');updateBars();
}
function consumeSel(n){
  const st=P.inv[P.sel];
  if(!st)return;
  if(P.gm===1)return;
  st.n-=n;
  if(st.n<=0)P.inv[P.sel]=null;
  refreshHotbar();
}
function damageTool(st,n){
  if(P.gm===1||!st)return;
  if(!IT[st.id].tool&&!IT[st.id].dur)return;
  if(st.ench&&st.ench.unbreaking&&Math.random()<st.ench.unbreaking/(st.ench.unbreaking+1))return;
  st.dmg=(st.dmg||0)+(n||1);
  const max=IT[st.id].dur||IT[st.id].tool?.dur||64;
  if(st.dmg>=max){P.inv[P.sel]=null;sfx('break')}
  refreshHotbar();
}
function breakBlock(x,y,z,silent){
  const id=getBlockE(x,y,z);
  if(id<=0)return;
  const def=B[id];
  if(def.hard<0){sfx('stone');return}
  const st=P.inv[P.sel];
  const{ok}=toolSpeed(def,st);
  setBlock(x,y,z,0);
  if(P.gm!==1&&GAMERULES.doTileDrops){
    const drops=ok?resolveDrop(def,Math.random):null;
    if(drops)for(const[k,n]of drops){
      let nn=n;
      if(st&&st.ench&&st.ench.fortune&&def.key.endsWith('_ore'))nn=n*(1+floor(Math.random()*(st.ench.fortune+1)));
      spawnDrop(x+.5,y+.5,z+.5,{id:k,n:nn});
    }

    furnaceStates.delete(k);

function onBlockChanged(x,y,z){
  /* 上方方块支撑检查 */
  const above=getBlockE(x,y+1,z);
  if(above>0){
    const ad=B[above];
    if(ad.falls)tryFall(x,y+1,z);
    if((ad.geo==='cross'||ad.geo==='torch')&&above!==BID.sugar_cane&&ad.key!=='cactus'){
      if(!ad.key.startsWith('wheat')){breakBlockSilentDrop(x,y+1,z)}
    }
  }
  /* 甘蔗/仙人掌连锁 */
  const self=getBlockE(x,y,z);
  if(self===0){
    const ab=getBlockE(x,y+1,z);
    if(ab===BID.sugar_cane||ab===BID.cactus)breakBlockSilentDrop(x,y+1,z);
    if(ab>0&&B[ab].key.startsWith('wheat'))breakBlockSilentDrop(x,y+1,z);
  }
  const below=getBlockE(x,y-1,z);
  if(self>0&&B[self].geo==='cross'&&below===0)breakBlockSilentDrop(x,y,z);
}
function breakBlockSilentDrop(x,y,z){
  const id=getBlockE(x,y,z);
  if(id<=0)return;
  const def=B[id];
  setBlock(x,y,z,0);
  if(GAMERULES.doTileDrops&&P.gm!==1){
    const drops=resolveDrop(def,Math.random);
    if(drops)for(const[k,n]of drops)spawnDrop(x+.5,y+.5,z+.5,{id:k,n});
  }
  onBlockChanged(x,y,z);
}
function tryFall(x,y,z){
  const id=getBlockE(x,y,z);
  if(id<=0||!B[id].falls)return;
  if(getBlockE(x,y-1,z)===0||B[getBlockE(x,y-1,z)].replaceable){
    setBlock(x,y,z,0);
    spawnFallingBlock(x,y,z,id);
  }
}
function tryPlace(){
  if(P.gm===3)return;
  const st=P.inv[P.sel];
  const hit=raycast(P.gm===1?6:P.reach,true);
  if(!hit)return;
  /* 对方块使用(容器等) */
  const tdef=B[hit.id];
  if(tdef.key==='chest'){openChest(hit.x,hit.y,hit.z);return}
  if(tdef.key==='furnace'||tdef.key==='furnace_lit'){openFurnace(hit.x,hit.y,hit.z);return}
  if(tdef.key==='crafting_table'){openInventory(3);return}
  if(tdef.key==='tnt'&&st&&st.id==='flint_and_steel'){
    setBlock(hit.x,hit.y,hit.z,0);spawnPrimedTNT(hit.x+.5,hit.y,hit.z+.5);damageTool(st,1);return;
  }
  if(st&&IT[st.id].use){
    if(useSpecialItem(st,hit))return;
  }
  if(!st||!IT[st.id].block)return;
  if(P.gm===2)return;
  let px=hit.x,py=hit.y,pz=hit.z;
  const tDef=B[hit.id];
  if(!tDef.replaceable){px+=hit.nx;py+=hit.ny;pz+=hit.nz}
  const exist=B[getBlockE(px,py,pz)];
  if(exist.id!==0&&!exist.replaceable)return;
  if(py<0||py>=WH)return;
  const bid=IT[st.id].block,bdef=B[bid];
  /* 不与玩家重叠 */
  if(!bdef.noCollide){
    const x0=P.pos.x-0.3,x1=P.pos.x+0.3,y0=P.pos.y,y1=P.pos.y+1.8,z0=P.pos.z-0.3,z1=P.pos.z+0.3;
    if(px+1>x0&&px<x1&&py+1>y0&&py<y1&&pz+1>z0&&pz<z1)return;
  }
  /* 支撑检查 */
  if(bdef.geo==='cross'||bdef.geo==='torch'){
    const below=B[getBlockE(px,py-1,pz)];
    if(bdef.key.startsWith('wheat')&&below.key!=='farmland')return;
    if(!bdef.key.startsWith('wheat')&&below.id===0)return;
  }
  /* 台阶上下半 */
  let placeId=bid;
  if(bdef.geo==='slab'||bdef.geo==='slabtop'){
    const topKey=bdef.key.replace('_slab_top','_slab').replace('_slab','_slab_top');
    const baseKey=bdef.key.replace('_slab_top','_slab');
    const hitY=(camera.position.y+rayDir().y*hit.d)-floor(camera.position.y+rayDir().y*hit.d);
    let top=false;
    if(hit.ny===-1)top=true;
    else if(hit.ny===0&&hitY>0.5)top=true;
    placeId=BID[top?baseKey+'_top':baseKey];
  }
  setBlock(px,py,pz,placeId);
  sfx('dig');
  consumeSel(1);
  onBlockChanged(px,py,pz);
  /* 沙子下落检查 */
  tryFall(px,py,pz);
}
function useSpecialItem(st,hit){
  const u=IT[st.id].use;
  const bx=hit.x+hit.nx,by=hit.y+hit.ny,bz=hit.z+hit.nz;
  if(u==='plant'){
    const t=B[hit.id];
    if(t.key==='farmland'&&getBlockE(hit.x,hit.y+1,hit.z)===0){
      setBlock(hit.x,hit.y+1,hit.z,BID.wheat0);consumeSel(1);sfx('dig');return true;
    }
    return false;
  }
  if(u==='bonemeal'){
    const t=getBlockE(hit.x,hit.y,hit.z);
    if(t>0&&B[t].key.startsWith('wheat')){
      const stg=min(7,parseInt(B[t].key.slice(5))+2+floor(Math.random()*3));
      setBlock(hit.x,hit.y,hit.z,BID['wheat'+stg]);consumeSel(1);return true;
    }
    if(t===BID.grass_block){
      for(let i=0;i<8;i++){
        const rx=hit.x+floor(Math.random()*5-2),rz=hit.z+floor(Math.random()*5-2);
        if(getBlockE(rx,hit.y+1,rz)===0&&getBlockE(rx,hit.y,rz)===BID.grass_block)
          setBlock(rx,hit.y+1,rz,Math.random()<0.7?BID.tall_grass:[BID.dandelion,BID.poppy][floor(Math.random()*2)]);
      }
      consumeSel(1);return true;
    }
    return false;
  }
  if(u==='bucket'){
    const t=B[hit.id];
    if(t.liquid==='water'){setBlock(hit.x,hit.y,hit.z,0);replaceSel('water_bucket');sfx('splash');return true}
    if(t.liquid==='lava'){setBlock(hit.x,hit.y,hit.z,0);replaceSel('lava_bucket');sfx('splash');return true}
    return false;
  }
  if(u==='bucket_water'||u==='bucket_lava'){
    const ex=B[getBlockE(bx,by,bz)];
    if(ex.id===0||ex.replaceable){
      setBlock(bx,by,bz,u==='bucket_water'?BID.water:BID.lava);
      replaceSel('bucket');sfx('splash');return true;
    }
    return false;
  }
  if(u==='hoe'){
    const t=B[hit.id];
    if((t.key==='grass_block'||t.key==='dirt')&&getBlockE(hit.x,hit.y+1,hit.z)===0){
      setBlock(hit.x,hit.y,hit.z,BID.farmland);sfx('dig');damageTool(st,1);return true;
    }
    return false;
  }
  if(u==='flint_and_steel'){sfx('click');damageTool(st,1);return true}
  return false;
}

/* 攻击实体 */
function tryAttack(){
  if(P.attackCd>0||P.gm===3)return;
  P.attackCd=0.4;
  const o=camera.position,d=rayDir();
  const reach=P.gm===1?5:3.2;
  let best=null,bestD=reach;
  const bh=raycast(reach);
  if(bh)bestD=min(bestD,bh.d);
  for(const e of ents){
    if(e.dead||e===playerProxy)continue;
    const dx=e.pos.x-o.x,dy=e.pos.y+e.h*0.5-o.y,dz=e.pos.z-o.z;
    const dist=Math.hypot(dx,dy,dz);
    if(dist>bestD+0.5)continue;
    const dot=(dx*d.x+dy*d.y+dz*d.z)/dist;
    if(dot<0.88)continue;
    if(dist<bestD+0.6){best=e;bestD=dist}
  }
  if(best){
    const st=P.inv[P.sel];
    let dmg=1;
    if(st&&IT[st.id].tool)dmg=IT[st.id].tool.dmg;
    if(st&&st.ench&&st.ench.sharpness)dmg+=st.ench.sharpness*1.25;
    dmg*=1+effectLvl('strength')*0.3;
    if(effectLvl('weakness'))dmg*=max(.2,1-effectLvl('weakness')*0.25);
    let kb=0.5;
    if(st&&st.ench&&st.ench.knockback)kb+=st.ench.knockback*0.5;
    best.damage(dmg,P,'attack');
    const dir=new THREE.Vector3(best.pos.x-P.pos.x,0,best.pos.z-P.pos.z).normalize().multiplyScalar(kb*8);
    best.vel.x+=dir.x;best.vel.z+=dir.z;best.vel.y+=3;
    if(st&&st.ench&&st.ench.fire_aspect)best.ignite(st.ench.fire_aspect*4);
    damageTool(st,1);
    sfx('hit');
    if(P.gm===0)addExh(0.1);
  }
}

    for(const[k,a,b]of this.def.drops){
      if(this.sheared&&k==='mutton'){/* 仍掉肉 */}
      const n=a+floor(Math.random()*(b-a+1))+ (Math.random()<loot*0.5?1:0);
      if(n>0)spawnDrop(this.pos.x,this.pos.y+0.5,this.pos.z,{id:k,n});
    }
    if(this.type==='sheep'&&!this.sheared)spawnDrop(this.pos.x,this.pos.y+0.5,this.pos.z,{id:'white_wool',n:1});
    spawnXP(this.pos.x,this.pos.y+0.5,this.pos.z,this.def.xp);
    spawnBurst(this.pos.clone().add(new THREE.Vector3(0,this.h/2,0)),0xff4040,12,0.3,3);
    if(this.type==='slime'&&this.size>1){
      for(let i=0;i<2;i++){const s=spawnEntity('slime',this.pos.x+(Math.random()-.5),this.pos.y,this.pos.z+(Math.random()-.5));s.size=this.size/2;s.w=0.45*s.size;s.h=0.45*s.size;s.hp=MOB_DEFS.slime.hp*s.size/2;
        s.group.clear();const mm=MODELS.slime(s.size);s.model=mm;s.group.add(...mm.g.children)}
    }
  }
  skyExposed(){
    const x=floor(this.pos.x),z=floor(this.pos.z);
    for(let y=floor(this.pos.y)+2;y<WH;y++){const id=getBlockE(x,y,z);if(id>0&&B[id].opaque)return false}
    return true;
  }
  update(dt){
    if(this.dead)return;
    const def=this.def;
    this.hurtFlash=max(0,this.hurtFlash-dt);
    /* 燃烧 */
    if(this.fireT>0){this.fireT-=dt;this.fireAcc=(this.fireAcc||0)+dt;
      if(this.fireAcc>1){this.fireAcc=0;this.damage(1,null,'fire')}
      if(Math.random()<dt*8)spawnBurst(this.pos.clone().add(new THREE.Vector3(0,this.h*0.7,0)),0xff8020,1,0.15,1);
    }
    if(def.burn&&isDay()&&!WEATHER.rain&&this.skyExposed()&&!this.inWater)this.ignite(8);
    /* 受伤闪红 */
    if(this.group)this.group.traverse(o=>{if(o.material&&o.material.emissive)o.material.emissiveIntensity=this.hurtFlash>0?0.9:0});
    /* AI */
    this.stateT-=dt;
    /* 末影人:被注视时激怒 */
    if(this.type==='enderman'&&!this.aggro&&!playerProxy.dead){
      const vd=new THREE.Vector3(this.pos.x-camera.position.x,this.pos.y+2.4-camera.position.y,this.pos.z-camera.position.z);
      const dl=vd.length();
      if(dl<24&&vd.normalize().dot(rayDir())>0.985){this.aggro=true;this.state='chase';sfx('tp')}
    }
    const toPlayer=playerProxy.dead?null:new THREE.Vector3().subVectors(P.pos,this.pos);
    const pDist=toPlayer?toPlayer.length():999;
    const diffOk=DIFFICULTY>0;
    let mx=0,mz=0,spd=def.speed;
    if(this.inWater){/* 游泳 */}
    if(def.hostile&&diffOk&&!playerProxy.dead&&pDist<20&&effectLvl('invisibility')===0){
      if(def.ranged){
        this.target=P.pos;
        if(pDist>10){mx=toPlayer.x/pDist;mz=toPlayer.z/pDist}
        else if(pDist<6){mx=-toPlayer.x/pDist;mz=-toPlayer.z/pDist}
        else{this.strafe=this.strafe||(Math.random()<.5?1:-1);mx=-toPlayer.z/pDist*this.strafe;mz=toPlayer.x/pDist*this.strafe}
        this.attackT-=dt;
        if(this.attackT<=0&&pDist<15){this.attackT=2+Math.random();
          const d=new THREE.Vector3().subVectors(new THREE.Vector3(P.pos.x,P.pos.y+1.2,P.pos.z),new THREE.Vector3(this.pos.x,this.pos.y+1.5,this.pos.z));
          const dist=d.length();d.normalize();
          d.y+=dist*0.02;
          spawnArrow(this.pos.x,this.pos.y+1.5,this.pos.z,d.multiplyScalar(18),2+DIFFICULTY,false);
        }
      }else if(def.creeper){
        this.target=P.pos;
        if(this.fuse>=0){
          this.fuse-=dt;
          const s=1+Math.sin(this.fuse*20)*0.15*(1.5-this.fuse);
          this.group.scale.set(s,s,s);
          if(pDist>3.5){this.fuse=-1;this.group.scale.set(1,1,1)}
          else if(this.fuse<=0){this.explodeNow();return}
        }else{
          if(pDist<2.2){this.fuse=1.5;sfx('fuse')}
          mx=toPlayer.x/pDist;mz=toPlayer.z/pDist;
        }
      }else{
        this.target=P.pos;
        mx=toPlayer.x/pDist;mz=toPlayer.z/pDist;
        if(def.jump&&this.onGround&&Math.random()<dt*2)this.vel.y=7;
        if(def.teleport&&Math.random()<dt*0.4){
          const a=Math.random()*6.28,r=4+Math.random()*6;
          const nx=P.pos.x+Math.cos(a)*r,nz=P.pos.z+Math.sin(a)*r,ny=getTopSolid(floor(nx),floor(nz))+1;
          if(ny>0&&ny<WH-2){spawnBurst(this.pos.clone(),0xc060ff,10,0.4,2);this.pos.set(nx,ny,nz);spawnBurst(this.pos.clone(),0xc060ff,10,0.4,2);sfx('tp')}
        }
        this.attackT-=dt;
        if(pDist<1.4+this.w&&this.attackT<=0){this.attackT=1;playerProxy.damage(def.dmg*(0.5+DIFFICULTY*0.25),def.name)}
      }
      if(pDist<64)this.yaw=Math.atan2(-(P.pos.x-this.pos.x),-(P.pos.z-this.pos.z));
    }else if(this.state==='flee'&&this.stateT>0){
      if(this.fleeDir){mx=this.fleeDir.x;mz=this.fleeDir.z;spd=def.speed*2}
    }else if(this.state==='chase'&&this.aggro&&!playerProxy.dead){
      mx=toPlayer.x/pDist;mz=toPlayer.z/pDist;
      this.attackT-=dt;
      if(pDist<1.4+this.w&&this.attackT<=0){this.attackT=1;playerProxy.damage(def.dmg,def.name)}
      if(pDist>32){this.aggro=false;this.state='idle'}
    }else{
      if(this.stateT<=0){
        this.stateT=2+Math.random()*4;
        if(Math.random()<0.6){this.state='walk';this.wYaw=Math.random()*6.28}
        else this.state='idle';
      }
      if(this.state==='walk'){mx=Math.sin(this.wYaw);mz=Math.cos(this.wYaw);spd=def.speed*0.6}
    }
    if(def.layEgg){this.eggT-=dt;if(this.eggT<0){this.eggT=300+Math.random()*300;spawnDrop(this.pos.x,this.pos.y+0.5,this.pos.z,{id:'egg',n:1})}}
    if(this.sheared){this.regrowT-=dt;if(this.regrowT<=0){this.sheared=false;if(this.model.g.userData.wool)this.model.g.userData.wool.visible=true}}
    /* 移动物理 */
    const acc=this.onGround?0.4:0.1;
    this.vel.x+=(mx*spd-this.vel.x)*acc;
    this.vel.z+=(mz*spd-this.vel.z)*acc;
    this.vel.y-=26*dt;this.vel.y=max(this.vel.y,-50);
    const liq=B[getBlockE(floor(this.pos.x),floor(this.pos.y+0.3),floor(this.pos.z))].liquid;
    this.inWater=liq==='water';
    if(this.inWater)this.vel.y=min(this.vel.y+30*dt,3.5);
    this.moving=abs(mx)+abs(mz)>0.1;
    if(this.moving)this.yawTarget=Math.atan2(-mx,-mz);
    if(this.yawTarget!==undefined){
      let dy=this.yawTarget-this.yaw;
      while(dy>Math.PI)dy-=Math.PI*2;while(dy<-Math.PI)dy+=Math.PI*2;
      this.yaw+=dy*min(1,dt*8);
    }
    /* 跳跃障碍 */
    this.moveAxisE(0,this.vel.x*dt);this.moveAxisE(2,this.vel.z*dt);
    this.onGround=false;this.moveAxisE(1,this.vel.y*dt);
    if(this.moving&&this.blockedH&&this.onGround)this.vel.y=8;
    /* 史莱姆跳 */
    if(this.type==='slime'&&this.onGround&&this.moving&&Math.random()<dt*3)this.vel.y=6;
    /* 模型 */
    this.group.position.copy(this.pos);
    this.group.rotation.y=this.yaw;
    this.walkPhase+=Math.hypot(this.vel.x,this.vel.z)*dt*1.6;
    const sw=Math.sin(this.walkPhase*2)*0.5;
    if(this.model.legs)this.model.legs.forEach((l,i)=>{l.rotation.x=(i%2===0?sw:-sw)});
    if(this.model.arms&&!def.hostile)this.model.arms.forEach((a,i)=>{a.rotation.x=(i%2===0?sw:-sw)*0.7});
    /* 窒息 */
    const head=B[getBlockE(floor(this.pos.x),floor(this.pos.y+this.h*0.8),floor(this.pos.z))];
    if(head.opaque&&!head.liquid){this.sufT=(this.sufT||0)+dt;if(this.sufT>1){this.sufT=0;this.damage(1,null,'suffocate')}}
    if(this.pos.y<-20)this.dead=true;
  }
  explodeNow(){
    this.dead=true;
    explode(this.pos.x,this.pos.y+0.5,this.pos.z,3,true);
  }
  moveAxisE(ax,amt){
    if(amt===0)return;
    const w=this.w/2,h=this.h;
    if(ax===0){this.pos.x+=amt;if(this.collideE(w,h)){this.pos.x-=amt;this.vel.x=0;this.blockedH=true}}
    else if(ax===2){this.pos.z+=amt;if(this.collideE(w,h)){this.pos.z-=amt;this.vel.z=0;this.blockedH=true}}
    else{this.pos.y+=amt;
      const c=this.collideE(w,h,true);
      if(c){if(amt<0){this.pos.y=c.y+1;this.onGround=true}else this.pos.y=c.y-h-0.01;
        this.vel.y=0}
    }
    if(ax!==1)this.blockedH=false;
  }
  collideE(w,h,yOnly){
    const x0=floor(this.pos.x-w),x1=floor(this.pos.x+w),y0=floor(this.pos.y),y1=floor(this.pos.y+h),z0=floor(this.pos.z-w),z1=floor(this.pos.z+w);
    for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++)
      if(isSolid(getBlockE(x,y,z)))return{x,y,z};
    return null;
  }
}

const iconTexCache={};
function iconTex(key){
  if(iconTexCache[key])return iconTexCache[key];
  const it=IT[key];
  const i=TEX[it.icon]!==undefined?TEX[it.icon]:0;
  const cv=document.createElement('canvas');cv.width=cv.height=32;
  const g=cv.getContext('2d');g.imageSmoothingEnabled=false;
  g.drawImage(AC,(i%32)*16,floor(i/32)*16,16,16,0,0,32,32);
  const t=new THREE.CanvasTexture(cv);t.magFilter=THREE.NearestFilter;t.colorSpace=THREE.SRGBColorSpace;
  iconTexCache[key]=t;return t;
}
class Drop{
  constructor(x,y,z,st){
    this.stack={...st};this.pos=new THREE.Vector3(x,y,z);
    this.vel=new THREE.Vector3((Math.random()-.5)*2,3.5,(Math.random()-.5)*2);
    this.age=0;this.h=0.25;this.isDrop=true;
    const m=new THREE.SpriteMaterial({map:iconTex(st.id)});
    this.sprite=new THREE.Sprite(m);this.sprite.scale.set(0.35,0.35,1);
    this.sprite.position.copy(this.pos);scene.add(this.sprite);
    this.dead=false;
  }
  damage(){}
  update(dt){
    this.age+=dt;
    if(this.age>300){this.dead=true;return}
    this.vel.y-=20*dt;
    this.pos.x+=this.vel.x*dt;this.pos.z+=this.vel.z*dt;this.pos.y+=this.vel.y*dt;
    const g=getTopSolid(floor(this.pos.x),floor(this.pos.z));
    if(this.pos.y<g+1.1){this.pos.y=g+1.1;this.vel.y=0;this.vel.x*=0.8;this.vel.z*=0.8}
    if(B[getBlockE(floor(this.pos.x),floor(this.pos.y),floor(this.pos.z))].liquid==='lava'){this.dead=true;sfx('fizz');return}
    const d=this.pos.distanceTo(P.pos);
    if(d<2&&!P.dead&&P.gm!==3){
      const pull=new THREE.Vector3().subVectors(P.pos,this.pos);pull.y+=1;
      this.pos.addScaledVector(pull.normalize(),dt*6);
      if(d<0.9){
        const left=addItem(this.stack.id,this.stack.n,this.stack);
        if(left===0){this.dead=true;sfx('pop')}else this.stack.n=left;
      }
    }
    this.sprite.position.set(this.pos.x,this.pos.y+0.15+Math.sin(this.age*3)*0.06,this.pos.z);
  }
  cleanup(){scene.remove(this.sprite)}
}
class XPOrb{

    this.h=0.2;this.age=0;this.dead=false;

function addXP(v){
  P.xp+=v;
  let need=xpNeed();
  while(P.xp>=need){P.xp-=need;P.xpLevel++;need=xpNeed();sfx('level')}
  updateBars();
}
function xpNeed(){return 5+P.xpLevel*2}
function spawnDrop(x,y,z,st){const e=new Drop(x,y,z,st);ents.push(e);return e}
function spawnXP(x,y,z,v){while(v>0){const o=Math.min(v,3);v-=o;ents.push(new XPOrb(x,y,z,o))}}
class Proj{
  constructor(type,x,y,z,vel,dmg,mine){
    this.isProj=true;
    this.type=type;this.pos=new THREE.Vector3(x,y,z);this.vel=vel.clone();
    this.dmg=dmg;this.mine=mine;this.dead=false;this.h=0.15;this.age=0;
    let color=0xffffff,s=0.12;
    if(type==='arrow')color=0xd8d8d8;
    if(type==='egg')color=0xe8dcc8;
    if(type==='snowball')color=0xffffff;
    if(type==='pearl'){color=0x1a6a68;s=0.16}
    this.mesh=new THREE.Mesh(new THREE.SphereGeometry(s,6,6),new THREE.MeshBasicMaterial({color}));
    this.mesh.position.copy(this.pos);scene.add(this.mesh);
  }
  damage(){}
  update(dt){
    this.age+=dt;if(this.age>20){this.dead=true;return}
    this.vel.y-=(this.type==='arrow'?20:22)*dt;
    const step=this.vel.length()*dt;
    const dir=this.vel.clone().normalize();
    /* 撞实体 */
    for(const e of ents){
      if(e.dead||e.isProj||e.isDrop)continue;
      if(this.mine&&e===this.owner)continue;
      const dx=e.pos.x-this.pos.x,dy=e.pos.y+e.h/2-this.pos.y,dz=e.pos.z-this.pos.z;
      if(Math.hypot(dx,dy,dz)<0.5+e.w){
        if(this.type==='arrow'||this.type==='snowball'){
          e.damage(this.dmg,this.owner||null,'proj');
          e.vel.addScaledVector(dir,3);
        }else if(this.type==='egg'){
          e.damage(0.5,this.owner||null,'proj');
        }
        this.land();return;
      }
    }
    /* 撞玩家 */
    if(!this.mine&&!playerProxy.dead){
      const dx=P.pos.x-this.pos.x,dy=P.pos.y+1-this.pos.y,dz=P.pos.z-this.pos.z;
      if(Math.hypot(dx,dy,dz)<0.9){damagePlayer(this.dmg,'箭');this.land();return}
    }
    this.pos.addScaledVector(this.vel,dt);
    const bid=getBlockE(floor(this.pos.x),floor(this.pos.y),floor(this.pos.z));
    if(bid>0&&!B[bid].liquid&&!B[bid].noCollide){this.land();return}
    this.mesh.position.copy(this.pos);
  }
  land(){
    this.dead=true;
    if(this.type==='pearl'&&this.mine){
      P.pos.set(this.pos.x,this.pos.y+0.2,this.pos.z);P.vel.set(0,0,0);
      damagePlayer(5,'末影珍珠');sfx('tp');
    }
    if(this.type==='egg'&&Math.random()<0.125)spawnEntity('chicken',this.pos.x,this.pos.y+0.2,this.pos.z);
    spawnBurst(this.pos,0xffffff,4,0.1,1);
  }
  cleanup(){scene.remove(this.mesh)}
}
function spawnArrow(x,y,z,vel,dmg,mine){const e=new Proj('arrow',x,y,z,vel,dmg,mine);ents.push(e);return e}
function throwItem(type){
  const st=P.inv[P.sel];
  if(!st)return;
  const d=rayDir();
  const speed=type==='pearl'?18:16;
  const vel=d.multiplyScalar(speed);vel.y+=2;
  const e=new Proj(type,camera.position.x+d.x*0.5,camera.position.y+d.y*0.5-0.2,camera.position.z+d.z*0.5,vel,0,true);
  ents.push(e);
  consumeSel(1);sfx('throw');
  P.throwCd=0.3;
}
function fireArrow(){
  const power=min(1,P.bowDraw/1.2);
  P.bowDraw=0;
  if(power<0.15)return;
  /* 找箭 */
  let arrowSlot=-1;
  if(P.gm===1)arrowSlot=-2;
  else for(let i=0;i<36;i++)if(P.inv[i]&&P.inv[i].id==='arrow'){arrowSlot=i;break}
  if(arrowSlot===-1){print('没有箭','#f88');return}
  if(arrowSlot>=0){P.inv[arrowSlot].n--;if(P.inv[arrowSlot].n<=0)P.inv[arrowSlot]=null;refreshHotbar()}
  const d=rayDir();
  const vel=d.multiplyScalar(14+power*20);
  const e=new Proj('arrow',camera.position.x+d.x*0.6,camera.position.y+d.y*0.6-0.15,camera.position.z+d.z*0.6,vel,2+power*8,true);
  ents.push(e);sfx('shoot');
}
class FallingBlockE{
  constructor(x,y,z,id){
    this.bid=id;this.pos=new THREE.Vector3(x+0.5,y,z+0.5);this.vel=new THREE.Vector3(0,0,0);
    this.h=0.98;this.dead=false;this.isFalling=true;
    this.mesh=new THREE.Mesh(new THREE.BoxGeometry(0.98,0.98,0.98),new THREE.MeshLambertMaterial({map:atlasTex}));
    /* UV 映射到该方块侧面纹理 */
    const uvAttr=this.mesh.geometry.attributes.uv;
    const tile=TEX[B[id].texSide],[u0,v0,ts]=TILEUV(tile);
    for(let i=0;i<uvAttr.count;i++)uvAttr.setXY(i,u0+uvAttr.getX(i)*ts,v0+uvAttr.getY(i)*ts);
    this.mesh.position.copy(this.pos);scene.add(this.mesh);
  }
  damage(){}
  update(dt){
    this.vel.y-=26*dt;this.pos.y+=this.vel.y*dt;
    const by=floor(this.pos.y);
    const cell=getBlockE(floor(this.pos.x),by,floor(this.pos.z));
    if(this.vel.y<0&&(isSolid(cell)||by<0)){
      const tx=floor(this.pos.x),ty=by+1,tz=floor(this.pos.z);
      const cur=getBlockE(tx,ty,tz);
      if(ty<WH&&(cur===0||B[cur].replaceable))setBlock(tx,ty,tz,this.bid);
      else spawnDrop(this.pos.x,this.pos.y+1,this.pos.z,{id:this.bid===BID.sand?'sand':'gravel',n:1});
      this.dead=true;
    }
    if(this.pos.y<-10)this.dead=true;
    this.mesh.position.copy(this.pos);
  }
  cleanup(){scene.remove(this.mesh)}
}
function spawnFallingBlock(x,y,z,id){ents.push(new FallingBlockE(x,y,z,id))}

let ACtx=null,masterGain=null;
function audioInit(){
  if(ACtx)return;
  ACtx=new(window.AudioContext||window.webkitAudioContext)();
  masterGain=ACtx.createGain();masterGain.gain.value=SET.vol;masterGain.connect(ACtx.destination);
}
function tone(f0,f1,dur,type,vol){
  if(!ACtx)return;
  const o=ACtx.createOscillator(),g=ACtx.createGain();
  o.type=type||'square';
  o.frequency.setValueAtTime(f0,ACtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(max(20,f1),ACtx.currentTime+dur);
  g.gain.setValueAtTime(vol||0.15,ACtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,ACtx.currentTime+dur);
  o.connect(g);g.connect(masterGain);
  o.start();o.stop(ACtx.currentTime+dur);
}
function noiseBurst(dur,filterF,vol){
  if(!ACtx)return;
  const len=ACtx.sampleRate*dur,buf=ACtx.createBuffer(1,len,ACtx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const src=ACtx.createBufferSource();src.buffer=buf;
  const f=ACtx.createBiquadFilter();f.type='lowpass';f.frequency.value=filterF;
  const g=ACtx.createGain();g.gain.value=vol||0.3;
  src.connect(f);f.connect(g);g.connect(masterGain);src.start();
}
function sfx(name){

    case 'pop':tone(500,900,0.08,'sine',0.12);break;
    case 'hurt':tone(300,80,0.2,'sawtooth',0.2);break;

    case 'explode':noiseBurst(1.2,200,0.6);tone(80,30,0.8,'sine',0.4);break;
    case 'fuse':noiseBurst(1.4,4000,0.1);break;

function clickSlot(slot,e){
  sfx('click');

  if(e.shiftKey&&e.button===0){quickMove(slot);refreshAll();return}
  if(e.button===0){
    if(!UI.held){if(cur){UI.held=cur;slot.set(null)}}
    else if(!cur){slot.set(UI.held);UI.held=null}
    else if(canMerge(cur,UI.held)){
      const lim=IT[cur.id].stack,a=min(lim-cur.n,UI.held.n);
      if(a>0){cur.n+=a;UI.held.n-=a;if(UI.held.n<=0)UI.held=null}
    }
    else{const t=UI.held;UI.held=cur;slot.set(t)}
  }else if(e.button===2){
    if(!UI.held){if(cur){const h=Math.ceil(cur.n/2);UI.held={...cur,n:h};cur.n-=h;if(cur.n<=0)slot.set(null)}}
    else if(!cur){slot.set({...UI.held,n:1});UI.held.n--;if(UI.held.n<=0)UI.held=null}
    else if(canMerge(cur,UI.held)&&cur.n<IT[cur.id].stack){cur.n++;UI.held.n--;if(UI.held.n<=0)UI.held=null}

function quickMove(slot){
  const cur=slot.get();if(!cur)return;
  const targets=QUICKMAP[slot.section]||[];
  for(const sec of targets){
    const slots=UI.slots.filter(s=>s.section===sec);
    for(const s of slots){
      if(s.opts.armor!==undefined){const a=IT[cur.id].armor;if(!a||ARMIDX[a.slot]!==s.opts.armor)continue}
      const t=s.get();
      if(t&&canMerge(t,cur)&&t.n<IT[t.id].stack){const a=min(IT[t.id].stack-t.n,cur.n);t.n+=a;cur.n-=a;if(cur.n<=0){slot.set(null);return}}
    }
    for(const s of slots){
      if(s.opts.armor!==undefined){const a=IT[cur.id].armor;if(!a||ARMIDX[a.slot]!==s.opts.armor)continue}
      if(!s.get()){s.set(cur);slot.set(null);return}
    }
  }
}

function gridKeys(){return UI.craftGrid.map(s=>{const st=s.get();return st?st.id:null})}
function findRecipe(keys,size){
  /* 形状配方 */
  let minR=99,maxR=-1,minC=99,maxC=-1;
  for(let r=0;r<size;r++)for(let c=0;c<size;c++){
    if(keys[r*size+c]){minR=min(minR,r);maxR=max(maxR,r);minC=min(minC,c);maxC=max(maxC,c)}
  }
  if(maxR<0)return null;
  const bh=maxR-minR+1,bw=maxC-minC+1;
  const grid=[];
  for(let r=0;r<bh;r++){grid.push([]);for(let c=0;c<bw;c++)grid[r].push(keys[(minR+r)*size+minC+c])}
  for(const r of RCP){
    if(r.shape){
      const ph=r.shape.length,pw=r.shape[0].length;
      if(ph!==bh||pw!==bw)continue;
      let ok=true,mir=true;
      for(let y=0;y<ph&&ok;y++)for(let x=0;x<pw&&ok;x++){
        const ch=r.shape[y][x]===' '?null:r.shape[y][x];
        if(!matchIng(ch?r.map[ch]:null,grid[y][x]))ok=false;
      }
      for(let y=0;y<ph&&mir;y++)for(let x=0;x<pw&&mir;x++){
        const ch=r.shape[y][pw-1-x]===' '?null:r.shape[y][pw-1-x];
        if(!matchIng(ch?r.map[ch]:null,grid[y][x]))mir=false;
      }
      if(ok||mir)return r;
    }else if(r.shapeless){
      const want=r.shapeless.slice();
      const have=grid.flat().filter(Boolean);
      if(have.length!==want.length)continue;
      const used=new Set();let ok=true;
      for(const w of want){
        let found=false;
        for(let i=0;i<have.length;i++){if(used.has(i))continue;if(matchIng(w,have[i])){used.add(i);found=true;break}}
        if(!found){ok=false;break}
      }
      if(ok)return r;
    }
  }
  return null;
}
function updateCraftResult(){
  const r=findRecipe(gridKeys(),UI.craftSize);
  UI.currentRecipe=r;
  if(UI.craftResult){UI.craftResult.set(r?{id:r.out,n:r.n}:null,true)}

function takeCraftResult(shift){
  const r=UI.currentRecipe;if(!r)return;
  const craft1=()=>{
    for(const s of UI.craftGrid){const st=s.get();if(st){st.n--;if(st.n<=0)s.set(null)}}
  };
  if(shift){
    let cnt=0;
    while(cnt<64){
      const rr=findRecipe(gridKeys(),UI.craftSize);
      if(!rr||rr.out!==r.out)break;
      if(addItem(rr.out,rr.n)>0)break;
      craft1();cnt++;
    }
  }else{
    const res={id:r.out,n:r.n};
    if(!UI.held)UI.held=res;
    else if(canMerge(UI.held,res)&&UI.held.n+res.n<=IT[r.out].stack)UI.held.n+=res.n;
    else return;
    craft1();
  }
  updateCraftResult();
  sfx('click');
}

function tickFurnaces(dt){
  for(const[key,fs]of furnaceStates){
    const[x,y,z]=key.split(',').map(Number);
    const bid=getBlock(x,y,z);
    if(bid!==BID.furnace&&bid!==BID.furnace_lit){furnaceStates.delete(key);continue}
    const smeltable=fs.in&&SMELT[fs.in.id]&&(!fs.out||(fs.out.id===SMELT[fs.in.id]&&fs.out.n<IT[fs.out.id].stack));
    if(fs.burn<=0&&smeltable&&fs.fuel&&FUELS[fs.fuel.id]){
      fs.burn=fs.burnMax=FUELS[fs.fuel.id];
      if(fs.fuel.id==='lava_bucket')fs.fuel={id:'bucket',n:1};
      else{fs.fuel.n--;if(fs.fuel.n<=0)fs.fuel=null}
    }
    if(fs.burn>0){
      fs.burn-=dt;
      if(smeltable){
        fs.prog+=dt;
        if(fs.prog>=10){
          fs.prog=0;
          const res=SMELT[fs.in.id];
          if(fs.out)fs.out.n++;else fs.out={id:res,n:1};
          fs.in.n--;if(fs.in.n<=0)fs.in=null;
          spawnXP(x+.5,y+1,z+.5,1);
        }
      }else fs.prog=0;
    }else fs.prog=max(0,fs.prog-dt*2);
    const wantLit=fs.burn>0;
    const curLit=bid===BID.furnace_lit;
    if(wantLit!==curLit){
      const px=floor(x),py=floor(y),pz=floor(z);
      setBlock(px,py,pz,wantLit?BID.furnace_lit:BID.furnace);
      noteLum(px,py,pz);
    }
    /* UI 刷新 */
    if(UI.screen==='furnace'&&UI.openPos&&UI.openPos.fs===fs){
      const bp=$('#fburn'),pp=$('#fprog');
      if(bp)bp.className=fs.burn>0?'on':'';
      if(pp)pp.firstChild.style.width=(fs.prog/10*100)+'%';
      refreshAll();
    }
  }
}

function stripNS(s){return(s||'').replace(/^minecraft:/,'')}
function parseCoord(tok,base){
  if(tok.startsWith('~')){const v=tok.slice(1);return base+(v?parseFloat(v):0)}
  return parseFloat(tok);
}
function selEntities(tok){
  tok=tok||'@s';
  const m=tok.match(/^@([psae])(?:\[type=([^\]]+)\])?$/);
  if(!m)return null;
  if(m[1]==='p'||m[1]==='s'||m[1]==='a')return(!m[2]||m[2]==='player')?[playerProxy]:[];
  const type=m[2];
  const out=[];
  for(const e of ents){
    if(e.dead)continue;
    if(!type){if(e.def)out.push(e)}
    else if(type==='item'){if(e.isDrop)out.push(e)}
    else if(e.def&&(e.type===type||e.def.name===type))out.push(e);
  }
  return out;
}

function cmdItem(s){const k=stripNS(s);if(IT[k])return k;print('未知物品: '+s,'#f88');return null}

regCmd('fill','/fill <x1> <y1> <z1> <x2> <y2> <z2> <方块> [replace|keep|outline|hollow]',a=>{
  if(a.length<7){print('用法: /fill <x1> <y1> <z1> <x2> <y2> <z2> <方块> [模式]','#f88');return}
  const k=cmdBlock(a[6]);if(!k)return;
  const x1=floor(parseCoord(a[0],P.pos.x)),y1=floor(parseCoord(a[1],P.pos.y)),z1=floor(parseCoord(a[2],P.pos.z));
  const x2=floor(parseCoord(a[3],P.pos.x)),y2=floor(parseCoord(a[4],P.pos.y)),z2=floor(parseCoord(a[5],P.pos.z));
  const mode=a[7]||'replace';
  const xa=min(x1,x2),xb=max(x1,x2),ya=min(y1,y2),yb=max(y1,y2),za=min(z1,z2),zb=max(z1,z2);
  const total=(xb-xa+1)*(yb-ya+1)*(zb-za+1);
  if(total>65536){print('区域过大 ('+total+'>65536)','#f88');return}
  const bid=BID[k];let n=0;
  for(let x=xa;x<=xb;x++)for(let y=ya;y<=yb;y++)for(let z=za;z<=zb;z++){
    if(y<0||y>=WH)continue;
    const edge=(x===xa||x===xb||y===ya||y===yb||z===za||z===zb);
    if(mode==='keep'&&getBlockE(x,y,z)!==0)continue;
    if(mode==='outline'&&!edge)continue;
    if(mode==='hollow'&&!edge){if(getBlockE(x,y,z)!==0){setBlock(x,y,z,0)}continue}
    setBlock(x,y,z,bid);n++;
  }
  print('已填充 '+n+' 个方块','#9f9');
});

function fmtPos(v){return floor(v.x)+' '+floor(v.y)+' '+floor(v.z)}
function execCommand(str){
  str=str.trim();
  if(str.startsWith('/'))str=str.slice(1);
  if(!str)return;
  const parts=str.split(/\s+/);
  const name=parts.shift().toLowerCase();
  const cmd=COMMANDS[name];
  if(!cmd){print('未知指令: /'+name+' · 输入 /help 查看帮助','#f88');return}
  try{cmd.fn(parts)}catch(e){print('指令出错: '+e.message,'#f88')}
}
function setGamemode(m){
  P.gm=m;
  if(m===1||m===3){P.flyEnabled=true;if(m===3)P.fly=true}
  else{P.flyEnabled=false;P.fly=false}
  updateBars();
  print('游戏模式已设为 '+GM_NAMES[m]+'模式','#9f9');
}
/* ================= 设置 ================= */
const SET={rd:12,fov:75,sens:1,vol:0.6,shadow:true,bloom:true,cloud:true,ao:true};
function loadSettings(){
  try{const s=JSON.parse(localStorage.getItem('mc_set')||'{}');Object.assign(SET,s)}catch(e){}
  $('#setRD').value=SET.rd;$('#setFOV').value=SET.fov;$('#setSens').value=SET.sens*100;
  $('#setVol').value=SET.vol*100;$('#setShadow').checked=SET.shadow;$('#setBloom').checked=SET.bloom;
  $('#setCloud').checked=SET.cloud;$('#setAO').checked=SET.ao;
  syncSetLabels();
}
function syncSetLabels(){
  $('#setRDV').textContent=SET.rd*16+' 格';
  $('#setFOVV').textContent=SET.fov;
  $('#setSensV').textContent=Math.round(SET.sens*100)+'%';
  $('#setVolV').textContent=Math.round(SET.vol*100)+'%';
}
function applySettings(){
  localStorage.setItem('mc_set',JSON.stringify(SET));
  if(camera){camera.fov=SET.fov;camera.far=SET.rd*16+2200;camera.updateProjectionMatrix()}
  if(renderer){renderer.shadowMap.enabled=SET.shadow}
  if(sunLight)sunLight.castShadow=SET.shadow;
  if(bloomPass)bloomPass.enabled=SET.bloom;
  AO_ON=SET.ao;
  if(masterGain)masterGain.gain.value=SET.vol;
  lastPC=null;
  for(const[k,c]of chunks)c.dirty=true;
}
function wireSettings(){
  $('#setRD').oninput=e=>{SET.rd=parseInt(e.target.value);syncSetLabels();applySettings()};
  $('#setFOV').oninput=e=>{SET.fov=parseInt(e.target.value);syncSetLabels();applySettings()};
  $('#setSens').oninput=e=>{SET.sens=parseInt(e.target.value)/100;syncSetLabels();applySettings()};
  $('#setVol').oninput=e=>{SET.vol=parseInt(e.target.value)/100;syncSetLabels();applySettings()};
  $('#setShadow').onchange=e=>{SET.shadow=e.target.checked;applySettings()};
  $('#setBloom').onchange=e=>{SET.bloom=e.target.checked;applySettings()};
  $('#setCloud').onchange=e=>{SET.cloud=e.target.checked;applySettings()};
  $('#setAO').onchange=e=>{SET.ao=e.target.checked;applySettings()};
}
/* ================= 界面管理 ================= */
const WORLD={loaded:false,name:'',id:'',paused:false};
let chatOpen=false,settingsFrom=null;
function showScreen(id){
  for(const s of['title','pause','death','settings','invScreen','creativeScreen','chestScreen','furnaceScreen'])
    $('#'+s).classList.toggle('on',s===id);
  $('#hud').style.display=WORLD.loaded&&!id?'block':'none';
  if(id){UI.screen=id==='invScreen'?'inv':id==='creativeScreen'?'creative':id==='chestScreen'?'chest':id==='furnaceScreen'?'furnace':UI.screen}
  else{UI.screen=null;UI.held=null}
  if(id&&typeof releasePointer==='function')releasePointer();
}
function closeContainer(){
  /* 关闭背包等界面,回到游戏 */
  if(UI.held){const l=addItem(UI.held.id,UI.held.n,UI.held);if(l>0)spawnDrop(P.pos.x,P.pos.y+1.2,P.pos.z,{...UI.held,n:l});UI.held=null}
  /* 归还合成格物品 */
  for(const s of UI.craftGrid){const st=s.get();if(st){const l=addItem(st.id,st.n,st);if(l>0)spawnDrop(P.pos.x,P.pos.y+1.2,P.pos.z,{...st,n:l});s.set(null)}}
  UI.slots=[];UI.craftGrid=[];UI.craftResult=null;
  showScreen(null);
  lockPointer();
}
function lockPointer(){
  if(!WORLD.loaded)return;
  document.body.requestPointerLock&&document.body.requestPointerLock();
}
function releasePointer(){document.exitPointerLock&&document.exitPointerLock()}
function isLocked(){return document.pointerLockElement===document.body||document.pointerLockElement===renderer?.domElement}
/* ---------- 聊天 ---------- */
function print(msg,color){
  const log=$('#chatlog');
  const d=el('div','',log);
  d.innerHTML=msg;
  if(color)d.style.color=color;
  while(log.children.length>30)log.removeChild(log.firstChild);
  setTimeout(()=>{d.style.transition='opacity 1s';if(!chatOpen){d.style.opacity=0.25}},9000);
}
function toast(msg){
  const t=$('#toast');
  t.textContent=msg;t.style.opacity=1;
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.opacity=0,2000);
}
function openChat(prefix){
  chatOpen=true;
  releasePointer();
  const inp=$('#chatinput');
  inp.style.display='block';
  inp.value=prefix||'';
  setTimeout(()=>inp.focus(),10);
}
function closeChat(){
  chatOpen=false;
  const inp=$('#chatinput');
  inp.style.display='none';inp.blur();
  if(WORLD.loaded&&!UI.screen)lockPointer();
}
/* ================= 输入 ================= */
const MOUSE={};
let lastSpaceT=0,placeRepeat=0;
function wireInput(){
  const cv=renderer.domElement;
  document.addEventListener('keydown',e=>{
    if(chatOpen){
      if(e.code==='Escape'){closeChat()}
      if(e.code==='Enter'){
        const v=$('#chatinput').value.trim();closeChat();
        if(v.startsWith('/'))execCommand(v);
        else if(v)print('&lt;你&gt; '+v.replace(/</g,'&lt;'));
      }
      e.stopPropagation();return;
    }
    if(e.code==='F3'){e.preventDefault();$('#debug').style.display=$('#debug').style.display==='block'?'none':'block';return}
    if(UI.screen){
      if(e.target&&e.target.tagName==='INPUT'){if(e.code==='Escape')e.target.blur();return}
      if(e.code==='Escape'||e.code==='KeyE'){closeContainer()}
      return;
    }
    if(!WORLD.loaded||P.dead)return;
    KEYS[e.code]=true;
    if(e.code==='KeyE'){P.gm===1?openCreative():openInventory(2);e.preventDefault()}
    if(e.code==='KeyT'){openChat('');e.preventDefault()}
    if(e.code==='Slash'){openChat('/');e.preventDefault()}
    if(e.code.startsWith('Digit')){const n=parseInt(e.code.slice(5));if(n>=1&&n<=9){P.sel=n-1;refreshHotbar()}}
    if(e.code==='Space'){
      const now=performance.now();
      if(now-lastSpaceT<280&&canFly()&&P.gm!==3){P.fly=!P.fly}
      lastSpaceT=now;
    }
    if(['Space','ShiftLeft','KeyW','KeyA','KeyS','KeyD'].includes(e.code))e.preventDefault();
  });
  document.addEventListener('keyup',e=>{KEYS[e.code]=false});
  document.addEventListener('mousemove',e=>{
    if(UI.screen){
      const hi=$('#heldIcon');
      hi.style.left=(e.clientX-19)+'px';hi.style.top=(e.clientY-19)+'px';
      return;
    }
    if(!isLocked()||!WORLD.loaded)return;
    P.yaw-=e.movementX*0.0022*SET.sens;
    P.pitch-=e.movementY*0.0022*SET.sens;
    P.pitch=clamp(P.pitch,-Math.PI/2+0.01,Math.PI/2-0.01);
  });
  document.addEventListener('mousedown',e=>{
    audioInit();
    MOUSE[e.button]=true;
    if(!WORLD.loaded||UI.screen||chatOpen||P.dead)return;
    if(!isLocked()){lockPointer();return}
    if(e.button===0){tryAttack()}
    if(e.button===2){rightPress()}
  });
  document.addEventListener('mouseup',e=>{
    MOUSE[e.button]=false;
    if(e.button===2&&P.bowDraw>0)fireArrow();
  });
  document.addEventListener('wheel',e=>{
    if(!WORLD.loaded||UI.screen)return;
    P.sel=(P.sel+(e.deltaY>0?1:-1)+9)%9;refreshHotbar();
  },{passive:true});
  document.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('pointerlockchange',()=>{
    if(!isLocked()&&WORLD.loaded&&!UI.screen&&!chatOpen&&!P.dead){
      showScreen('pause');
    }
  });
}
function rightPress(){
  if(P.gm===3)return;
  const st=P.inv[P.sel];
  /* 实体交互 */
  const d=rayDir(),o=camera.position;
  for(const e of ents){
    if(e.dead||!e.def)continue;
    const dx=e.pos.x-o.x,dy=e.pos.y+e.h*0.5-o.y,dz=e.pos.z-o.z;
    const dist=Math.hypot(dx,dy,dz);
    if(dist>4.5)continue;
    if((dx*d.x+dy*d.y+dz*d.z)/dist<0.9)continue;
    if(st&&st.id==='shears'&&e.type==='sheep'&&!e.sheared){
      e.sheared=true;e.regrowT=90;
      if(e.model.g.userData.wool)e.model.g.userData.wool.visible=false;
      const n=1+floor(Math.random()*3);
      spawnDrop(e.pos.x,e.pos.y+0.8,e.pos.z,{id:'white_wool',n});
      damageTool(st,1);sfx('dig');return;
    }
    if(st&&st.id==='bucket'&&e.type==='cow'){replaceSel('milk_bucket');sfx('pop');return}
    if(e.type==='villager'){sfx('click');print('村民: 哼~','#c9f');return}
  }
  if(st){
    const u=IT[st.id].use;
    if(u==='throw_pearl'){if((P.throwCd||0)<=0)throwItem('pearl');return}
    if(u==='throw_egg'){if((P.throwCd||0)<=0)throwItem('egg');return}
    if(u==='throw_snowball'){if((P.throwCd||0)<=0)throwItem('snowball');return}
    if(u==='spawn_egg'){useSpawnEgg(st.id);return}
    if(u==='bow'){return}
    if(IT[st.id].armor){
      const a=IT[st.id].armor,idx=ARMIDX[a.slot];
      const old=P.armor[idx];
      P.armor[idx]=st;P.inv[P.sel]=old;
      updateBars();refreshHotbar();sfx('click');return;
    }
  }
  tryPlace();
}
