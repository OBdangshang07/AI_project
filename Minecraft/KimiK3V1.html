/* ================= 存档(IndexedDB) ================= */
let db=null;
function idb(){return new Promise((res,rej)=>{
  if(db){res(db);return}
  const r=indexedDB.open('mcweb',1);
  r.onupgradeneeded=()=>{r.result.createObjectStore('kv')};
  r.onsuccess=()=>{db=r.result;res(db)};
  r.onerror=()=>rej(r.error);
})}
function idbGet(k){return idb().then(d=>new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}))}
function idbSet(k,v){return idb().then(d=>new Promise((res,rej)=>{const q=d.transaction('kv','readwrite').objectStore('kv').put(v,k);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)}))}
function idbDel(k){return idb().then(d=>new Promise((res,rej)=>{const q=d.transaction('kv','readwrite').objectStore('kv').delete(k);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)}))}
async function getWorldList(){return(await idbGet('worlds'))||[]}
async function saveWorld(){
  if(!WORLD.loaded)return;
  const chunkKeys=[];
  for(const[k,c]of chunks){
    if(c.modified){
      await idbSet(`w:${WORLD.id}:c:${c.cx},${c.cz}`,c.data);
      c.modified=false;
    }
    chunkKeys.push(k);
  }
  const containers={chests:{},furnaces:{}};
  for(const[k,v]of chestStates)containers.chests[k]=v;
  for(const[k,v]of furnaceStates)containers.furnaces[k]=v;
  const meta={name:WORLD.name,seed:WSEED,time:worldTime,gm:P.gm,diff:DIFFICULTY,
    pos:[P.pos.x,P.pos.y,P.pos.z],spawn:[P.spawn.x,P.spawn.y,P.spawn.z],
    inv:P.inv,armor:P.armor,hp:P.hp,food:P.food,xp:P.xp,xpLevel:P.xpLevel,sel:P.sel,
    gamerules:GAMERULES,weather:{rain:WEATHER.rain,thunder:WEATHER.thunder},
    chunks:chunkKeys,fly:P.fly,flyEnabled:P.flyEnabled};
  await idbSet(`w:${WORLD.id}:meta`,meta);
  await idbSet(`w:${WORLD.id}:cont`,containers);
  const list=await getWorldList();
  const i=list.findIndex(w=>w.id===WORLD.id);
  const entry={id:WORLD.id,name:WORLD.name,seed:WSEED,gm:P.gm,t:Date.now()};
  if(i>=0)list[i]=entry;else list.push(entry);
  await idbSet('worlds',list);
}
function clearWorldRuntime(){
  for(const[k,c]of chunks){for(const m of c.meshes){worldGroup.remove(m);m.geometry.dispose()}}
  chunks.clear();
  for(const[k,m]of lodCells){lodGroup.remove(m);m.geometry.dispose()}
  lodCells.clear();lodNeed=new Map();lastPC=null;
  for(const e of ents){if(e.cleanup)e.cleanup();if(e.group)scene.remove(e.group)}
  ents.length=0;
  lumBlocks.clear();chestStates.clear();furnaceStates.clear();
}
async function bootWorld(id,name,seed){
  clearWorldRuntime();
  WORLD.id=id;WORLD.name=name;WORLD.loaded=true;
  WSEED=seed;NZ=makeNoise(seed);
  P.effects.clear();P.dead=false;P.god=false;
  let meta=null;
  if(id)meta=await idbGet(`w:${id}:meta`);
  if(meta){
    worldTime=meta.time;P.gm=meta.gm;DIFFICULTY=meta.diff;
    P.pos.set(...meta.pos);P.spawn.set(...meta.spawn);
    P.inv=meta.inv;P.armor=meta.armor;P.hp=meta.hp;P.food=meta.food;
    P.xp=meta.xp;P.xpLevel=meta.xpLevel;P.sel=meta.sel||0;
    Object.assign(GAMERULES,meta.gamerules||{});
    WEATHER.rain=meta.weather?.rain||0;WEATHER.thunder=meta.weather?.thunder||false;
    P.fly=meta.fly;P.flyEnabled=meta.flyEnabled;
    const cont=await idbGet(`w:${id}:cont`);
    if(cont){for(const k in cont.chests)chestStates.set(k,cont.chests[k]);for(const k in cont.furnaces)furnaceStates.set(k,cont.furnaces[k])}
    for(const ck of meta.chunks||[]){
      const data=await idbGet(`w:${id}:c:${ck}`);
      if(data){const[cx,cz]=ck.split(',').map(Number);
        const c={cx,cz,data:new Uint8Array(data),dirty:true,modified:false,meshes:[]};
        chunks.set(ck,c);
        for(let y=0;y<WH;y++)for(let z2=0;z2<16;z2++)for(let x2=0;x2<16;x2++){
          const bid=data[IDX(x2,y,z2)];if(bid>0&&B[bid].lum>0)lumBlocks.set((cx*16+x2)+','+y+','+(cz*16+z2),{x:cx*16+x2,y,z:cz*16+z2,lum:B[bid].lum,id:bid});
        }
      }
    }
  }else{
    worldTime=6000;P.gm=0;P.fly=false;P.flyEnabled=false;
    P.inv=new Array(36).fill(null);P.armor=new Array(4).fill(null);
    P.hp=20;P.food=20;P.sat=5;P.xp=0;P.xpLevel=0;P.sel=0;
    /* 寻找陆地出生点 */
    let sx=8,sz=8;
    outer:
    for(let r=0;r<40;r++){
      for(let i=0;i<16;i++){
        const a=i/16*Math.PI*2,x=8+Math.round(Math.cos(a)*r*8),z=8+Math.round(Math.sin(a)*r*8);
        if(heightAt(x,z)>=SEA){sx=x;sz=z;break outer}
      }
    }
    ensureChunk(floor(sx/16),floor(sz/16));
    const gy=getTopSolid(sx,sz);
    P.pos.set(sx+.5,(gy>0?gy:SEA)+1,sz+.5);
    P.spawn.copy(P.pos);
  }
  P.vel.set(0,0,0);P.yaw=0;P.pitch=0;
  buildHotbar();refreshAll();updateBars();
  showScreen(null);
  print('欢迎来到 '+name+' · 种子 '+seed,'#9f9');
  print('按 / 输入指令,/help 查看全部指令','#9cf');
  lockPointer();
}
async function quitToTitle(){
  toast('正在保存…');
  await saveWorld();
  WORLD.loaded=false;
  clearWorldRuntime();
  releasePointer();
  showScreen('title');
  renderWorldList();
}
async function renderWorldList(){
  const wl=$('#worldList');wl.innerHTML='';
  const list=await getWorldList();
  if(!list.length)wl.innerHTML='<div class="kv" style="padding:6px">暂无存档</div>';
  for(const w of list){
    const d=el('div','witem',wl);
    d.innerHTML=`<b>${w.name}</b> <span class="dim">种子:${w.seed} · ${GM_NAMES[w.gm??0]}模式</span>`;
    d.onclick=()=>{toast('加载世界中…');setTimeout(()=>bootWorld(w.id,w.name,w.seed),50)};
    const del=el('button','mcbtn small',d);
    del.textContent='删除';del.style.cssText='width:60px;float:right;padding:2px 0;font-size:11px;margin:0';
    del.onclick=async e=>{e.stopPropagation();
      const meta=await idbGet(`w:${w.id}:meta`);
      if(meta&&meta.chunks)for(const ck of meta.chunks)await idbDel(`w:${w.id}:c:${ck}`);
      await idbDel(`w:${w.id}:meta`);await idbDel(`w:${w.id}:cont`);
      const l=await getWorldList();await idbSet('worlds',l.filter(x=>x.id!==w.id));
      renderWorldList();
    };
  }
}
/* ================= 主循环 ================= */
let lastT=performance.now(),fps=0,fpsAcc=0,fpsN=0,saveT=0,rtT=0;
function tick(){
  requestAnimationFrame(tick);
  const now=performance.now();
  const dt=clamp((now-lastT)/1000,0.001,0.05);
  lastT=now;
  fpsAcc+=dt;fpsN++;
  if(fpsAcc>=0.5){fps=Math.round(fpsN/fpsAcc);fpsAcc=0;fpsN=0}
  P.throwCd=max(0,(P.throwCd||0)-dt);
  const fullPause=['title','pause','death','settings'].some(s=>$('#'+s).classList.contains('on'));
  if(WORLD.loaded&&!fullPause&&!UI.screen&&!P.dead){
    updatePlayer(dt);
    placeRepeat-=dt;
    if(MOUSE[2]&&placeRepeat<=0){placeRepeat=0.25;rightPress()}
    if(MOUSE[0]&&P.attackCd<=0)tryAttack();
  }
  if(WORLD.loaded&&!fullPause){
    updateEntities(dt);
    updateSpawner(dt);
    tickFurnaces(dt);
    updateChunks(dt);
    updateEnvironment(dt);
    updateParticles(dt);
    /* 随机刻(作物/树苗/草蔓延/甘蔗) */
    rtT-=dt;
    if(rtT<=0){rtT=0.4;randomTick()}
    /* 夜视/吸收 */
    if(effectLvl('night_vision'))hemiLight.intensity=max(hemiLight.intensity,0.85);
    P.maxHp=20+effectLvl('absorption')*4;
    if(P.hp>P.maxHp)P.hp=P.maxHp;
    /* 自动保存 */
    saveT+=dt;
    if(saveT>30){saveT=0;saveWorld()}
    /* 调试信息 */
    if($('#debug').style.display==='block'){
      const bx=floor(P.pos.x),by=floor(P.pos.y),bz=floor(P.pos.z);
      const hit=raycast(6);
      $('#debug').textContent=
`Minecraft Web · ${fps} FPS
XYZ: ${P.pos.x.toFixed(1)} / ${P.pos.y.toFixed(1)} / ${P.pos.z.toFixed(1)}
区块: ${floor(P.pos.x/16)},${floor(P.pos.z/16)} · 群系: ${biomeAt(bx,bz).name}
模式: ${GM_NAMES[P.gm]} · 难度: ${['和平','简单','普通','困难'][DIFFICULTY]}
时间: ${floor(worldTime)} · 天气: ${WEATHER.rain?(WEATHER.thunder?'雷暴':'雨'):'晴'}
实体: ${ents.length} · 区块: ${chunks.size} · LOD: ${lodCells.size}
看向: ${hit?B[hit.id].name+' ('+hit.x+','+hit.y+','+hit.z+')':'—'}
种子: ${WSEED} · 视距: ${SET.rd*16}格`;
    }
  }
  if(bloomPass&&bloomPass.enabled)composer.render();
  else if(renderer)renderer.render(scene,camera);
}
function randomTick(){
  const pcx=floor(P.pos.x/16),pcz=floor(P.pos.z/16);
  for(let i=0;i<12;i++){
    const cx=pcx+floor(Math.random()*9-4),cz=pcz+floor(Math.random()*9-4);
    const c=chunks.get(CK(cx,cz));if(!c)continue;
    const lx=floor(Math.random()*16),lz=floor(Math.random()*16);
    const wx=cx*16+lx,wz=cz*16+lz;
    const y=getTopSolid(wx,wz);
    if(y<=0)continue;
    const top=getBlockE(wx,y+1,wz);
    const td=B[top];
    if(td.key.startsWith('wheat')&&Math.random()<0.25){
      const stg=parseInt(td.key.slice(5));
      if(stg<7)setBlock(wx,y+1,wz,BID['wheat'+(stg+1)]);
    }
    if(top===BID.sugar_cane&&Math.random()<0.12){
      let h=1;while(getBlockE(wx,y+1-h+1,wz)===BID.sugar_cane&&h<3)h++;
      if(h<3&&getBlockE(wx,y+2,wz)===0)setBlock(wx,y+2,wz,BID.sugar_cane);
    }
    if(top===BID.cactus&&Math.random()<0.1){
      let h=1;while(getBlockE(wx,y+2-h,wz)===BID.cactus&&h<3)h++;
      if(h<3&&getBlockE(wx,y+2,wz)===0)setBlock(wx,y+2,wz,BID.cactus);
    }
    if((top===BID.oak_sapling||top===BID.birch_sapling||top===BID.spruce_sapling)&&Math.random()<0.1){
      growTree(wx,y+1,wz,top);
    }
    const dirt=getBlockE(wx,y,wz);
    if(dirt===BID.dirt&&Math.random()<0.08){
      let nearGrass=false;
      for(const[dx,dz]of[[1,0],[-1,0],[0,1],[0,-1]])if(getBlockE(wx+dx,y,wz+dz)===BID.grass_block)nearGrass=true;
      if(nearGrass&&getBlockE(wx,y+1,wz)===0)setBlock(wx,y,wz,BID.grass_block);
    }
  }
}
function growTree(x,y,z,sapId){
  const type=sapId===BID.spruce_sapling?'spruce':sapId===BID.birch_sapling?'birch':'oak';
  const log=type==='spruce'?BID.spruce_log:type==='birch'?BID.birch_log:BID.oak_log;
  const leaf=type==='spruce'?BID.spruce_leaves:type==='birch'?BID.birch_leaves:BID.oak_leaves;
  const h=type==='spruce'?7:5+floor(Math.random()*2);
  if(y+h+2>=WH)return;
  for(let i=0;i<h;i++)setBlock(x,y+i,z,log);
  for(let ly=y+h-3;ly<=y+h;ly++){
    const rad=ly>=y+h?1:2;
    for(let dx=-rad;dx<=rad;dx++)for(let dz=-rad;dz<=rad;dz++){
      if(dx===0&&dz===0&&ly<y+h)continue;
      if(abs(dx)===rad&&abs(dz)===rad&&Math.random()<0.5)continue;
      const cur=getBlockE(x+dx,ly,z+dz);
      if(cur===0||B[cur].leaf)setBlock(x+dx,ly,z+dz,leaf);
    }
  }
}
/* ================= 启动 ================= */
function boot(){
  const canvas=$('#c');
  renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=SET.shadow;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.0;
  scene=new THREE.Scene();
  scene.fog=new THREE.Fog(0x78a7ff,60,400);
  camera=new THREE.PerspectiveCamera(SET.fov,innerWidth/innerHeight,0.1,SET.rd*16+2200);
  camera.position.set(8.5,80,8.5);
  scene.add(worldGroup);scene.add(lodGroup);
  composer=new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  bloomPass=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.45,0.6,0.82);
  composer.addPass(bloomPass);
  composer.addPass(new OutputPass());
  addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);
  });
  initEnvironment();initParticles();initInteract();
  buildHotbar();drawIconURLs();updateBars();
  loadSettings();wireSettings();applySettings();
  wireInput();
  renderWorldList();
  $('#btnCreate').onclick=()=>{
    const name=$('#wName').value.trim()||'新的世界';
    const sv=$('#wSeed').value.trim();
    const seed=sv?(isNaN(Number(sv))?hashStr(sv):Number(sv)):floor(Math.random()*2147483647);
    toast('正在生成世界…');
    setTimeout(()=>bootWorld('w'+Date.now(),name,seed),60);
  };
  $('#btnSettings1').onclick=()=>{settingsFrom='title';showScreen('settings')};
  $('#btnSettings2').onclick=()=>{settingsFrom='pause';showScreen('settings')};
  $('#btnCloseSet').onclick=()=>{showScreen(settingsFrom||'title');if(!settingsFrom||settingsFrom==='pause')UI.screen=null};
  $('#btnResume').onclick=()=>{showScreen(null);lockPointer()};
  $('#btnQuit').onclick=()=>quitToTitle();
  document.querySelectorAll('.gmBtn').forEach(b=>b.onclick=()=>{setGamemode(parseInt(b.dataset.gm));showScreen(null);lockPointer()});
  $('#btnRespawn').onclick=()=>{respawn();showScreen(null);lockPointer()};
  $('#btnDeathTitle').onclick=()=>quitToTitle();
  tick();
  window.__mc={P,chunks,ents,SET,WORLD,execCommand,setGamemode,spawnEntity,setBlock,getBlockE,addItem,raycast,updateChunks,lodCells,applySettings,breakBlock,tryPlace,saveWorld,quitToTitle,bootWorld,chestStates,get lodNeed(){return lodNeed},get fps(){return fps}};
}
boot();
